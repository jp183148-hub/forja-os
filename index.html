// =====================================================================
//  Lista de ordens (filtros e paginação no servidor)
// =====================================================================
const LISTA = { filtro: 'andamento', busca: '', tecnico: '', ordem: 'recentes' };
const POR_PAGINA = 40;
const FILTROS_OS = [
  ['andamento', 'Em andamento'], ['Recebido', 'Recebidas'], ['Em análise', 'Em diagnóstico'], ['Aguardando aprovação', 'Aguardando aprovação'],
  ['Aguardando peça', 'Aguardando peça'], ['Em conserto', 'Em manutenção'], ['Pronto', 'Prontas'], ['atrasadas', 'Atrasadas'],
  ['paradas', 'Sem atualização'], ['saldo', 'Com saldo a receber'], ['garantia', 'Em garantia'], ['retornos', 'Retornos'],
  ['Entregue', 'Entregues'], ['Cancelado', 'Canceladas'], ['todas', 'Todas']
];

function linhaOS(o) {
  const dias = diasDesde(o.status_desde);
  const atras = atrasada(o);
  return `<a class="item" href="#/ordem/${esc(o.id)}">
    <span class="n">#${nOS(o.numero)}</span>
    <span class="c"><b data-n="#${nOS(o.numero)}">${esc(o.cliente_nome || 'Sem nome')}</b><small>${esc(o.cliente_tel || '')}</small></span>
    <span class="a">${esc([o.marca, o.modelo].filter(Boolean).join(' ') || o.tipo_aparelho || '—')}<small>${o.ordem_origem_id ? 'Retorno de garantia · ' : ''}entrada ${dataBR(o.data_entrada)}</small></span>
    <span class="s">${pillStatus(o.status)}${ABERTOS.includes(o.status) && dias > 0 ? `<small class="faint" style="display:block;font-size:11.5px;margin-top:2px">há ${dias} dia${dias > 1 ? 's' : ''}</small>` : ''}</span>
    <span class="p ${atras ? 'atrasada' : ''}">${o.status === 'Entregue' ? `Entregue ${dataBR(o.data_entrega)}` : o.data_previsao ? `${atras ? 'Atrasada · ' : 'Prev. '}${dataBR(o.data_previsao)}` : ''}</span>
    <span class="t">${esc(nomeMembro(o.tecnico_id) || '—')}</span>
    <span class="v">${brl(o.total)}${num(o.saldo) > 0.009 && o.status !== 'Cancelado' && num(o.recebido) > 0 ? `<small>falta ${brl(o.saldo)}</small>` : num(o.saldo) > 0.009 && o.status === 'Entregue' ? `<small>falta ${brl(o.saldo)}</small>` : ''}</span>
  </a>`;
}
const cabecalhoLista = () => `<div class="lista-cab"><span>Nº</span><span>Cliente</span><span>Aparelho</span><span>Status</span><span>Prazo</span><span class="t">Técnico</span><span style="text-align:right">Valor</span></div>`;

TELAS.ordens = async (app, r) => {
  if (r.q.get('f')) LISTA.filtro = r.q.get('f');
  if (r.q.has('tec')) LISTA.tecnico = r.q.get('tec');
  let pagina = 0, total = 0, linhas = [];
  const cont = v => S.abertas.filter(o => o.status === v).length;
  const contagem = { andamento: S.abertas.length, atrasadas: S.abertas.filter(atrasada).length };
  ABERTOS.forEach(v => contagem[v] = cont(v));
  app.innerHTML = `
    <div class="cab"><div><h1 class="h1">Ordens de serviço</h1><p class="sub" id="ord-sub">&nbsp;</p></div>
      <div class="cab-acoes">${escreve('ordens.editar') ? `<a class="btn pri" href="#/ordens/nova">${ico('mais')} Nova OS</a>` : ''}</div></div>
    <div class="chips" role="group" aria-label="Filtros">${FILTROS_OS.map(([k, t]) => `<button type="button" class="chip" data-f="${esc(k)}" aria-pressed="${LISTA.filtro === k}">${esc(t)}${contagem[k] ? ` <b>${contagem[k]}</b>` : ''}</button>`).join('')}</div>
    <div class="row">
      <div class="input-ico" style="flex:1 1 260px">${ico('busca', 'sm')}<input id="ord-busca" type="search" placeholder="Filtrar por nº, cliente, telefone, modelo ou IMEI" value="${esc(LISTA.busca)}" aria-label="Filtrar ordens"></div>
      <select id="ord-tec" style="flex:0 1 200px" aria-label="Técnico"><option value="">Todos os técnicos</option><option value="sem" ${LISTA.tecnico === 'sem' ? 'selected' : ''}>Sem técnico</option>
        ${tecnicos().map(t => `<option value="${esc(t.user_id)}" ${LISTA.tecnico === t.user_id ? 'selected' : ''}>${esc(t.nome || 'Membro')}</option>`).join('')}</select>
      <select id="ord-ordem" style="flex:0 1 190px" aria-label="Ordenar">${[['recentes', 'Mais recentes'], ['antigas', 'Mais antigas'], ['previsao', 'Prazo mais próximo'], ['atualizadas', 'Atualizadas por último'], ['valor', 'Maior valor']]
        .map(([k, t]) => `<option value="${k}" ${LISTA.ordem === k ? 'selected' : ''}>${t}</option>`).join('')}</select>
    </div>
    <div id="ord-lista"></div>`;

  const lista = $('#ord-lista', app);
  async function carregar(mais) {
    if (!mais) { pagina = 0; linhas = []; lista.innerHTML = `<div class="lista">${cabecalhoLista()}${carregando()}</div>`; }
    const r2 = await API.ordensPagina(empId(), { ...LISTA, dias: cfg('alerta_sem_atualizacao_dias') || 3 }, pagina * POR_PAGINA, (pagina + 1) * POR_PAGINA - 1);
    total = r2.total; linhas = linhas.concat(r2.linhas);
    $('#ord-sub', app).textContent = `${total} ordem${total === 1 ? '' : 's'} neste filtro`;
    if (!linhas.length) {
      lista.innerHTML = `<div class="card flat">${LISTA.busca ? vazio('busca', 'Nada encontrado com essa busca', 'Confira o número, o nome ou o telefone.')
        : LISTA.filtro === 'andamento' ? vazio('ordens', 'Nenhuma ordem em andamento', 'As ordens abertas aparecem aqui.', escreve('ordens.editar') ? `<a class="btn pri" href="#/ordens/nova">${ico('mais')} Abrir a primeira OS</a>` : '')
        : vazio('filtro', 'Nenhuma ordem neste filtro')}</div>`;
      return;
    }
    lista.innerHTML = `<div class="lista">${cabecalhoLista()}${linhas.map(linhaOS).join('')}
      <div class="lista-pe"><span>Mostrando ${linhas.length} de ${total}</span>${linhas.length < total ? '<button class="btn sm" type="button" id="ord-mais">Carregar mais</button>' : ''}</div></div>`;
    const bm = $('#ord-mais', lista); if (bm) bm.onclick = async () => { bm.disabled = true; pagina++; await carregar(true); };
  }
  app.addEventListener('click', e => {
    const c = e.target.closest('[data-f]'); if (!c) return;
    LISTA.filtro = c.dataset.f; $$('[data-f]', app).forEach(x => x.setAttribute('aria-pressed', String(x === c)));
    history.replaceState(null, '', '#/ordens?f=' + encodeURIComponent(LISTA.filtro));
    carregar().catch(er => toast(msgErro(er), true));
  });
  $('#ord-busca', app).addEventListener('input', debounce(e => { LISTA.busca = e.target.value; carregar().catch(er => toast(msgErro(er), true)); }, 300));
  $('#ord-tec', app).onchange = e => { LISTA.tecnico = e.target.value; carregar().catch(er => toast(msgErro(er), true)); };
  $('#ord-ordem', app).onchange = e => { LISTA.ordem = e.target.value; carregar().catch(er => toast(msgErro(er), true)); };
  await carregar();
};

TELAS.nova = async (app, r) => {
  if (!escreve('ordens.editar')) {
    app.innerHTML = `<div class="card">${vazio('ordens', 'Você não pode abrir ordens agora', ativo() ? 'Seu papel na equipe não permite criar ordens.' : 'A assinatura está vencida: o sistema está só para consulta.', '<a class="btn" href="#/ordens">Voltar</a>')}</div>`;
    return;
  }
  const emp = S.empresa;
  const N = {
    passo: 1, cliente: null, hist: null, novo: { nome: '', tel: '', doc: '', email: '' }, dup: null,
    tipo: 'Celular', marca: '', modelo: '', imei: '', cor: '', senha: '', acess: new Set(), acessExtra: '', checks: new Set(), fotos: [],
    defeito: '', previsao: '', tecnico: S.ini.papel === 'tecnico' ? S.ini.uid : '', garantia: emp.garantia_padrao ?? 90, sinal: '', formaSinal: 'Pix', obs: '',
    origem: null
  };
  // vindo de "nova OS para este cliente" ou de "retorno de garantia"
  if (r.q.get('cliente')) { const c = await API.cliente(r.q.get('cliente')); if (c) await escolherCliente(c, false); }
  if (r.q.get('retorno')) {
    const o = await API.ordem(r.q.get('retorno'));
    if (o) {
      N.origem = o;
      if (o.cliente_id) { const c = await API.cliente(o.cliente_id); if (c) await escolherCliente(c, false); }
      Object.assign(N, { tipo: o.tipo_aparelho || 'Celular', marca: o.marca, modelo: o.modelo, imei: o.imei, cor: o.cor, garantia: 0 });
      N.defeito = `Retorno da OS nº ${nOS(o.numero)} (${o.reparo || 'serviço anterior'}): `;
    }
  }

  async function escolherCliente(c, repintar = true) {
    N.cliente = c; N.dup = null;
    try {
      const os = await API.ordensDoCliente(c.id);
      const hoje = hojeISO();
      const aparelhos = [];
      os.forEach(o => { const k = (o.imei || '') + '|' + (o.marca || '') + '|' + (o.modelo || '');
        if ((o.marca || o.modelo) && !aparelhos.some(a => a.k === k)) aparelhos.push({ k, tipo: o.tipo_aparelho, marca: o.marca, modelo: o.modelo, imei: o.imei, cor: o.cor, ultima: o }); });
      N.hist = { ordens: os, garantias: os.filter(o => o.status === 'Entregue' && o.garantia_ate && o.garantia_ate >= hoje), aparelhos: aparelhos.slice(0, 6),
                 abertas: os.filter(o => ABERTOS.includes(o.status)) };
    } catch { N.hist = null; }
    if (repintar) pintar();
  }

  const passoValido = p => {
    if (p === 1) return N.cliente || N.novo.nome.trim() || soDigitos(N.novo.tel).length >= 8 ? '' : 'Escolha um cliente cadastrado ou digite o nome do novo cliente.';
    if (p === 2) return N.marca.trim() || N.modelo.trim() ? '' : 'Digite pelo menos a marca ou o modelo do aparelho.';
    if (p === 3) return N.defeito.trim() ? '' : 'Descreva o defeito relatado pelo cliente.';
    return '';
  };

  function resumoCliente() {
    const c = N.cliente, h = N.hist;
    return `<div class="resumo-cliente">
      <div class="between"><span><b style="color:var(--ink);font-size:15px">${esc(c.nome || 'Sem nome')}</b> · ${esc(c.telefone || 'sem telefone')}</span>
        ${N.origem ? '' : `<button type="button" class="btn sm" id="n-trocar">Trocar cliente</button>`}</div>
      ${h ? `<span>${h.ordens.length ? `<b>${h.ordens.length}</b> ordem${h.ordens.length > 1 ? 's' : ''} anterior${h.ordens.length > 1 ? 'es' : ''}${h.ordens[0] ? ` · última em ${dataBR(h.ordens[0].data_entrada)}` : ''}` : 'Primeira vez na assistência'}</span>` : ''}
      ${h && h.garantias.length ? `<span>${ico('garantia', 'sm')} <b>${h.garantias.length}</b> serviço${h.garantias.length > 1 ? 's' : ''} em garantia: ${h.garantias.slice(0, 2).map(o => `OS ${nOS(o.numero)} (${esc(o.reparo || o.modelo || '')}) até ${dataBR(o.garantia_ate)}`).join('; ')}. Se for o mesmo defeito, abra como <a class="link" href="#/ordens/nova?retorno=${esc(h.garantias[0].id)}">retorno de garantia</a>.</span>` : ''}
      ${h && h.abertas.length ? `<span>${ico('alerta', 'sm')} Já tem ${h.abertas.length} ordem${h.abertas.length > 1 ? 's' : ''} em andamento: ${h.abertas.map(o => `<a class="link" href="#/ordem/${esc(o.id)}">#${nOS(o.numero)}</a>`).join(', ')}</span>` : ''}
    </div>`;
  }

  function passo1() {
    if (N.cliente) return `<div class="card"><h2>Cliente</h2>${resumoCliente()}</div>`;
    return `<div class="card"><h2>Cliente cadastrado</h2>
        <div class="input-ico">${ico('busca', 'sm')}<input id="n-busca" type="search" placeholder="Digite o nome ou o telefone" autocomplete="off" aria-label="Buscar cliente"></div>
        <div class="sugestoes" id="n-sug"></div>
      </div>
      <div class="card"><h2>Ou cadastre um novo cliente</h2>
        <div class="g g2">
          ${campo('n-nome', 'Nome', N.novo.nome, 'maxlength="120" autocomplete="off" placeholder="Maria Souza"')}
          ${campo('n-tel', 'WhatsApp com DDD', N.novo.tel, 'maxlength="30" inputmode="tel" autocomplete="off" placeholder="(24) 99999-9999"')}
          ${campo('n-doc', 'CPF (opcional)', N.novo.doc, 'maxlength="30" inputmode="numeric" autocomplete="off"')}
          ${campo('n-email', 'E-mail (opcional)', N.novo.email, 'type="email" maxlength="120" autocomplete="off"')}
        </div>
        <div id="n-dup"></div>
      </div>`;
  }

  function passo2() {
    const marcas = MARCAS[N.tipo] || [];
    const checklistsExtra = S.modelos.filter(m => m.tipo === 'checklist' && (!m.dados.tipo_aparelho || m.dados.tipo_aparelho === N.tipo));
    const itensCheck = [...new Set([...(CHECKLISTS[N.tipo] || []), ...checklistsExtra.flatMap(m => m.dados.itens || [])])];
    return `${N.hist && N.hist.aparelhos.length ? `<div class="card flat"><h2>Aparelhos deste cliente <small>toque para preencher</small></h2><div class="opcoes">${N.hist.aparelhos.map((a, i) =>
        `<button type="button" class="opcao" data-ap="${i}">${esc([a.marca, a.modelo].filter(Boolean).join(' '))}${a.imei ? ` · …${esc(String(a.imei).slice(-4))}` : ''}</button>`).join('')}</div></div>` : ''}
      <div class="card"><h2>Aparelho</h2>
        <div class="f"><span class="lbl">Tipo</span><div class="opcoes">${TIPOS.map(t => `<button type="button" class="opcao" data-tipo="${t}" aria-pressed="${N.tipo === t}">${t}</button>`).join('')}</div></div>
        ${marcas.length ? `<div class="f" style="margin-top:12px"><span class="lbl">Marca</span><div class="opcoes">${marcas.map(m => `<button type="button" class="opcao" data-marca="${esc(m)}" aria-pressed="${N.marca === m}">${esc(m)}</button>`).join('')}</div></div>` : ''}
        <div class="g" style="margin-top:12px">
          ${campo('n-marca', 'Marca', N.marca, 'maxlength="60" placeholder="Outra marca"')}
          ${campo('n-modelo', 'Modelo', N.modelo, 'maxlength="80" placeholder="iPhone 13, Galaxy A54…"')}
          ${campo('n-imei', 'IMEI ou nº de série', N.imei, 'maxlength="40" inputmode="numeric" class="mono" autocomplete="off"')}
          ${campo('n-cor', 'Cor', N.cor, 'maxlength="40"')}
          ${campo('n-senha', 'Senha ou padrão de desbloqueio', N.senha, 'maxlength="60" autocomplete="off"')}
        </div>
        <p class="hint">A senha fica guardada só até a entrega e é apagada automaticamente quando a OS é entregue.</p>
      </div>
      <div class="card"><h2>Acessórios deixados</h2>
        <div class="opcoes">${ACESSORIOS.map(a => `<button type="button" class="opcao" data-acess="${esc(a)}" aria-pressed="${N.acess.has(a)}">${esc(a)}</button>`).join('')}</div>
        <div class="f" style="margin-top:10px">${campo('n-acess', 'Outros', N.acessExtra, 'maxlength="200" placeholder="Ex.: suporte veicular"')}</div>
      </div>
      <div class="card"><h2>Como o aparelho chegou <small>marque o que foi conferido na frente do cliente</small></h2>
        <div class="checks">${itensCheck.map(c => `<label class="check"><input type="checkbox" data-check="${esc(c)}" ${N.checks.has(c) ? 'checked' : ''}> ${esc(c)}</label>`).join('')}</div>

      </div>`;
  }

  function passo3() {
    const defeitos = S.modelos.filter(m => m.tipo === 'defeito');
    const prazos = [['Hoje', 0], ['Amanhã', 1], ['2 dias', 2], ['3 dias', 3], ['1 semana', 7]];
    return `<div class="card"><h2>Defeito relatado</h2>
        ${defeitos.length ? `<div class="opcoes" style="margin-bottom:8px">${defeitos.map(m => `<button type="button" class="opcao" data-def="${esc(m.id)}">${esc(m.titulo)}</button>`).join('')}</div>` : ''}
        ${area('n-defeito', 'O que o cliente disse', N.defeito, 'maxlength="2000" placeholder="Ex.: caiu no chão e a tela ficou sem imagem"')}
      </div>
      <div class="card"><h2>Prazo e responsável</h2>
        <div class="f"><span class="lbl">Previsão de entrega</span><div class="opcoes">${prazos.map(([t, d]) => `<button type="button" class="opcao" data-prazo="${d}" aria-pressed="${N.previsao === somaDias(hojeISO(), d)}">${t}</button>`).join('')}</div></div>
        <div class="g" style="margin-top:12px">
          ${campo('n-previsao', 'Data prevista', N.previsao, 'type="date"')}
          ${selecao('n-tecnico', 'Técnico responsável', [['', 'Definir depois'], ...tecnicos().map(t => [t.user_id, t.nome || 'Membro'])], N.tecnico)}
          ${campo('n-garantia', 'Garantia do serviço (dias)', N.garantia, 'type="number" min="0" max="3650" inputmode="numeric"')}
          ${escreve('recebimentos.registrar') ? campo('n-sinal', 'Sinal recebido agora (R$)', N.sinal, 'type="number" min="0" step="0.01" inputmode="decimal" placeholder="0,00"') : ''}
          ${escreve('recebimentos.registrar') ? selecao('n-forma', 'Forma do sinal', PAGAMENTOS, N.formaSinal) : ''}
          ${campo('n-obs', 'Observações (saem no documento)', N.obs, 'maxlength="2000"')}
        </div>
        ${N.origem ? `<p class="hint">${ico('garantia', 'sm')} Retorno da OS nº ${nOS(N.origem.numero)}. A cobertura será avaliada pelo técnico; garantia nova começa em 0 dias até a decisão.</p>` : ''}
      </div>
      <div class="card flat"><h2>Resumo</h2><div class="valores">
        <div class="lin"><span>Cliente</span><b style="font-family:var(--body)">${esc(N.cliente ? N.cliente.nome : N.novo.nome || '—')}</b></div>
        <div class="lin"><span>Aparelho</span><b style="font-family:var(--body)">${esc([N.tipo, N.marca, N.modelo].filter(Boolean).join(' · '))}</b></div>
        <div class="lin"><span>Conferido na entrada</span><span>${N.checks.size} item${N.checks.size === 1 ? '' : 's'} · ${N.fotos.length} foto${N.fotos.length === 1 ? '' : 's'}</span></div>
      </div></div>`;
  }

  function pintar() {
    const nomes = ['Cliente', 'Aparelho', 'Atendimento'];
    app.innerHTML = `
      <div class="cab"><div><a class="link" href="#/ordens">${ico('esq', 'sm')} Ordens</a><h1 class="h1">${N.origem ? 'Retorno de garantia' : 'Nova ordem de serviço'}</h1></div></div>
      <div class="etapas-nova" role="list">${nomes.map((t, i) => `<button type="button" class="etapa-nova ${N.passo > i + 1 ? 'feita' : ''}" data-passo="${i + 1}" ${N.passo === i + 1 ? 'aria-current="step"' : ''}><b>${N.passo > i + 1 ? '✓' : i + 1}</b><span>${t}</span></button>`).join('')}</div>
      <div class="stack" id="n-corpo">${N.passo === 1 ? passo1() : N.passo === 2 ? passo2() : passo3()}</div>
      <p class="erro-txt" id="n-erro" role="alert"></p>
      <div class="salvar-barra">
        <span class="estado">Etapa ${N.passo} de 3</span>
        ${N.passo > 1 ? `<button type="button" class="btn" id="n-voltar">${ico('esq', 'sm')} Voltar</button>` : ''}
        ${N.passo < 3 ? `<button type="button" class="btn pri" id="n-seguir">Continuar ${ico('dir', 'sm')}</button>` : `<button type="button" class="btn pri" id="n-abrir">${ico('check', 'sm')} Abrir OS</button>`}
      </div>`;
    ligar();
  }

  function ler() {
    const v = id => { const el = $('#' + id, app); return el ? el.value : null; };
    if (N.passo === 1 && !N.cliente) { N.novo = { nome: v('n-nome') ?? N.novo.nome, tel: v('n-tel') ?? N.novo.tel, doc: v('n-doc') ?? N.novo.doc, email: v('n-email') ?? N.novo.email }; }
    if (N.passo === 2) { ['marca', 'modelo', 'imei', 'cor', 'senha'].forEach(k => { const x = v('n-' + k); if (x !== null) N[k] = x; }); const a = v('n-acess'); if (a !== null) N.acessExtra = a; }
    if (N.passo === 3) {
      N.defeito = v('n-defeito') ?? N.defeito; N.previsao = v('n-previsao') ?? N.previsao; N.tecnico = v('n-tecnico') ?? N.tecnico;
      N.garantia = v('n-garantia') ?? N.garantia; N.obs = v('n-obs') ?? N.obs;
      if (v('n-sinal') !== null) N.sinal = v('n-sinal'); if (v('n-forma') !== null) N.formaSinal = v('n-forma');
    }
  }

  function ir(p) {
    ler();
    if (p > N.passo) { for (let i = N.passo; i < p; i++) { const e = passoValido(i); if (e) { $('#n-erro', app).textContent = e; return; } } }
    N.passo = p; pintar(); window.scrollTo({ top: 0 });
  }

  function ligar() {
    $$('[data-passo]', app).forEach(b => b.onclick = () => ir(+b.dataset.passo));
    const bv = $('#n-voltar', app); if (bv) bv.onclick = () => ir(N.passo - 1);
    const bs = $('#n-seguir', app); if (bs) bs.onclick = () => ir(N.passo + 1);
    const ba = $('#n-abrir', app); if (ba) ba.onclick = () => abrirOS(ba);
    const bt = $('#n-trocar', app); if (bt) bt.onclick = () => { N.cliente = null; N.hist = null; pintar(); setTimeout(() => { const i = $('#n-busca', app); if (i) i.focus(); }, 0); };
    // busca de cliente
    const bq = $('#n-busca', app);
    if (bq) {
      let res = [];
      bq.addEventListener('input', debounce(async () => {
        const q = bq.value; const box = $('#n-sug', app);
        if (q.trim().length < 2) { box.innerHTML = ''; return; }
        try {
          res = await API.buscarClientes(empId(), q);
          box.innerHTML = res.length ? res.map((c, i) => `<button type="button" class="sugestao" data-cli="${i}"><span>${esc(c.nome || 'Sem nome')}</span><small>${esc(c.telefone || '')}</small></button>`).join('')
            : `<p class="hint">Nenhum cliente encontrado. Cadastre abaixo.</p>`;
        } catch (e) { box.innerHTML = `<p class="erro-txt">${esc(msgErro(e))}</p>`; }
      }, 250));
      $('#n-sug', app).addEventListener('click', e => { const b = e.target.closest('[data-cli]'); if (b) escolherCliente(res[+b.dataset.cli]); });
      setTimeout(() => bq.focus(), 0);
    }
    // aviso de cliente repetido pelo telefone
    const tel = $('#n-tel', app);
    if (tel) tel.addEventListener('input', debounce(async () => {
      const d = soDigitos(tel.value), box = $('#n-dup', app);
      if (d.length < 10) { box.innerHTML = ''; return; }
      try {
        const r2 = await API.clientesPorTelefone(empId(), d);
        box.innerHTML = r2.length ? `<div class="banner info" style="margin:12px 0 0"><span>Já existe ${esc(r2[0].nome || 'um cliente')} com este telefone.</span><button type="button" class="btn sm" id="n-usar-dup">Usar este cadastro</button></div>` : '';
        const u = $('#n-usar-dup', app); if (u) u.onclick = () => escolherCliente(r2[0]);
      } catch { }
    }, 400));
  }

  function cliques(e) {
    const t = e.target;
    const tp = t.closest('[data-tipo]'); if (tp) { ler(); N.tipo = tp.dataset.tipo; N.checks.clear(); pintar(); return; }
    const mc = t.closest('[data-marca]'); if (mc) { ler(); N.marca = N.marca === mc.dataset.marca ? '' : mc.dataset.marca; pintar(); return; }
    const ac = t.closest('[data-acess]'); if (ac) { ler(); const a = ac.dataset.acess; N.acess.has(a) ? N.acess.delete(a) : N.acess.add(a); ac.setAttribute('aria-pressed', String(N.acess.has(a))); return; }
    const ap = t.closest('[data-ap]'); if (ap) { const a = N.hist.aparelhos[+ap.dataset.ap]; Object.assign(N, { tipo: a.tipo || 'Celular', marca: a.marca || '', modelo: a.modelo || '', imei: a.imei || '', cor: a.cor || '' }); pintar(); return; }
    const rf = t.closest('[data-rmfoto]'); if (rf) { ler(); N.fotos.splice(+rf.dataset.rmfoto, 1); pintar(); return; }
    const pz = t.closest('[data-prazo]'); if (pz) { ler(); N.previsao = somaDias(hojeISO(), +pz.dataset.prazo); pintar(); return; }
    const df = t.closest('[data-def]'); if (df) { ler(); const m = S.modelos.find(x => x.id === df.dataset.def); if (m) N.defeito = (N.defeito.trim() ? N.defeito.trim() + '\n' : '') + m.conteudo; pintar(); return; }
  }
  async function mudancas(e) {
    const t = e.target;
    if (t.dataset.check) { t.checked ? N.checks.add(t.dataset.check) : N.checks.delete(t.dataset.check); return; }
    if (t.id === 'n-fotos') {
      ler();
      for (const arq of [...t.files].filter(f => f.type.startsWith('image/')).slice(0, 12 - N.fotos.length)) {
        try { const c = await comprimir(arq); N.fotos.push({ ...c, url: URL.createObjectURL(c.blob) }); } catch { toast(`Não consegui abrir "${arq.name}".`, true); }
      }
      pintar();
    }
  }

  async function abrirOS(bt) {
    ler();
    for (const p of [1, 2, 3]) { const e = passoValido(p); if (e) { N.passo = p; pintar(); $('#n-erro', app).textContent = e; return; } }
    bt.disabled = true; bt.textContent = 'Abrindo…';
    const acess = [...N.acess, N.acessExtra.trim()].filter(Boolean).join(', ');
    const c = N.cliente;
    const dados = {
      empresa_id: empId(), cliente_id: c ? c.id : null,
      cliente_nome: (c ? c.nome : N.novo.nome).trim(), cliente_tel: (c ? c.telefone : N.novo.tel).trim(),
      cliente_doc: (c ? c.documento : N.novo.doc || '').trim(), cliente_email: (c ? c.email : N.novo.email || '').trim().toLowerCase(),
      tipo_aparelho: N.tipo, marca: N.marca.trim(), modelo: N.modelo.trim(), imei: N.imei.trim(), cor: N.cor.trim(), senha: N.senha.trim(),
      acessorios: acess.slice(0, 300), checks: [...N.checks], defeito: N.defeito.trim(), obs: N.obs.trim(),
      data_previsao: N.previsao || null, tecnico_id: N.tecnico || null, garantia: Math.max(0, Math.min(3650, Math.round(num(N.garantia)))),
      itens: [], ordem_origem_id: N.origem ? N.origem.id : null, garantia_decisao: N.origem ? 'em_avaliacao' : ''
    };
    let o;
    try { o = await API.criarOrdem(dados); }
    catch (e) { $('#n-erro', app).textContent = msgErro(e); bt.disabled = false; bt.innerHTML = `${ico('check', 'sm')} Abrir OS`; return; }
    try {
      if (N.fotos.length) {
        const fotos = [];
        for (const f of N.fotos) {
          const path = `${empId()}/${o.id}/entrada-${Date.now().toString(36)}-${chaveUnica('f').slice(-8)}.jpg`;
          await API.enviarArquivo('os-fotos', path, f.blob); fotos.push({ path, w: f.w, h: f.h, etapa: 'entrada' });
        }
        await API.salvarOrdem(o.id, { fotos });
      }
    } catch (e) { toast('A OS foi aberta, mas as fotos não foram enviadas: ' + msgErro(e), true); }
    try { if (num(N.sinal) > 0) await API.receber({ ordem_id: o.id, tipo: 'sinal', valor: Math.round(num(N.sinal) * 100) / 100, forma: N.formaSinal, chave: chaveUnica('sinal') }); }
    catch (e) { toast('A OS foi aberta, mas o sinal não foi registrado: ' + msgErro(e), true); }
    recarregarAbertas();
    location.hash = `#/ordem/${o.id}?aberta=1`;
  }

  app.addEventListener('click', cliques);
  app.addEventListener('change', mudancas);
  pintar();
};

// =====================================================================
//  Ordem de serviço (visualização, edição, fluxo, orçamento, pagamentos, histórico)
// =====================================================================
const OS = { o: null, base: null, fotos: [], fotosRem: [], ev: [], orcs: [], recs: [], link: null, retornos: [], origem: null, aba: 'atendimento', imgs: new Map() };
const CAMPOS_OS = ['cliente_id', 'cliente_nome', 'cliente_tel', 'cliente_doc', 'cliente_email', 'tipo_aparelho', 'marca', 'modelo', 'imei', 'cor', 'senha',
  'acessorios', 'checks', 'defeito', 'diagnostico', 'reparo', 'obs', 'obs_interna', 'testes_saida', 'data_entrada', 'data_previsao', 'tecnico_id', 'garantia',
  'itens', 'mao_obra', 'desconto', 'taxa_cartao', 'forma_pagamento', 'garantia_decisao', 'garantia_obs'];
const FLUXO = ['Recebido', 'Em análise', 'Aguardando aprovação', 'Aguardando peça', 'Em conserto', 'Pronto', 'Entregue'];

// mesmo cálculo do banco (o banco é quem vale; aqui é prévia)
const precoItem = it => (it.preco !== undefined && it.preco !== null && it.preco !== '') ? num(it.preco) : num(it.custo) * (1 + num(it.margem) / 100);
function valoresOS(o) {
  const itens = o.itens || [];
  const custo = itens.reduce((s, it) => s + num(it.custo) * (num(it.qtd) || 1), 0);
  const pecas = itens.reduce((s, it) => s + precoItem(it) * (num(it.qtd) || 1), 0);
  const subtotal = Math.max(0, pecas + num(o.mao_obra) - num(o.desconto));
  const taxa = Math.min(num(o.taxa_cartao), 30) / 100;
  const total = taxa > 0 ? subtotal / (1 - taxa) : subtotal;
  const valorTaxa = total - subtotal;
  const lucro = total - custo - valorTaxa;
  return { custo, pecas, subtotal, total, valorTaxa, lucro, margem: custo > 0 ? lucro / custo * 100 : null };
}

function dadosOS(o) {
  const d = {};
  CAMPOS_OS.forEach(k => d[k] = o[k]);
  ['cliente_nome', 'cliente_tel', 'cliente_doc', 'marca', 'modelo', 'imei', 'cor', 'senha', 'acessorios', 'defeito', 'diagnostico', 'reparo', 'obs', 'obs_interna', 'forma_pagamento', 'garantia_obs']
    .forEach(k => d[k] = String(d[k] ?? '').trim());
  d.cliente_email = String(d.cliente_email || '').trim().toLowerCase();
  d.itens = (o.itens || []).filter(it => String(it.nome || '').trim() || num(it.custo) || num(it.preco))
    .map(it => { const x = { nome: String(it.nome || '').trim().slice(0, 80), qtd: Math.max(1, Math.min(999, Math.round(num(it.qtd) || 1))), custo: Math.max(0, num(it.custo)), margem: Math.min(1000, Math.max(0, num(it.margem))) };
      if (it.preco !== undefined && it.preco !== null && it.preco !== '') x.preco = Math.max(0, num(it.preco));
      if (it.peca_id) x.peca_id = it.peca_id; return x; });
  d.mao_obra = Math.max(0, num(o.mao_obra)); d.desconto = Math.max(0, num(o.desconto)); d.taxa_cartao = Math.min(30, Math.max(0, num(o.taxa_cartao)));
  d.garantia = Math.min(3650, Math.max(0, Math.round(num(o.garantia))));
  d.data_previsao = o.data_previsao || null; d.tecnico_id = o.tecnico_id || null; d.cliente_id = o.cliente_id || null;
  d.data_entrada = o.data_entrada || hojeISO();
  return d;
}
const assinaturaOS = () => JSON.stringify(dadosOS(OS.o)) + JSON.stringify(OS.fotos.map(f => f.path || f.url)) ;
let baseAssinatura = '';

async function urlFotoOS(f) {
  if (f.url) return f.url;
  if (OS.imgs.has(f.path)) return OS.imgs.get(f.path);
  const p = API.baixarArquivo('os-fotos', f.path).then(b => URL.createObjectURL(b));
  OS.imgs.set(f.path, p);
  try { return await p; } catch (e) { OS.imgs.delete(f.path); throw e; }
}

TELAS.ordem = async (app, r) => {
  const o = await API.ordem(r.id);
  if (!o) { app.innerHTML = `<div class="card">${vazio('busca', 'Ordem não encontrada', 'Ela pode ter sido excluída ou ser de outra assistência.', '<a class="btn" href="#/ordens">Voltar às ordens</a>')}</div>`; return; }
  if (OS.o && OS.o.id !== o.id) OS.aba = 'atendimento';
  OS.o = clone(o); OS.base = clone(o); OS.fotos = (o.fotos || []).map(f => ({ ...f })); OS.fotosRem = [];
  OS.aba = r.q.get('aba') || OS.aba || 'atendimento';
  await carregarExtrasOS();
  baseAssinatura = assinaturaOS();
  S.salvarPendente = salvarOS;
  pintarOS(app);
  ligarOS(app);
  if (r.q.get('aberta')) { history.replaceState(null, '', '#/ordem/' + o.id); folhaOSAberta(); }
};

async function carregarExtrasOS() {
  const id = OS.o.id;
  const [ev, orcs, recs, link, retornos, origem] = await Promise.all([
    API.eventos(id), API.orcamentos(id), API.recebimentos(id),
    pode('ordens.editar') ? API.linkAtivo(id).catch(() => null) : Promise.resolve(null),
    API.retornosDe(id), OS.o.ordem_origem_id ? API.ordemResumo(OS.o.ordem_origem_id) : Promise.resolve(null)]);
  Object.assign(OS, { ev, orcs, recs, link, retornos, origem });
}

function marcarSujoOS() {
  S.sujo = assinaturaOS() !== baseAssinatura;
  const b = $('#os-salvar'); if (!b) return;
  b.hidden = !S.sujo;
  const e = $('#os-estado'); if (e) { e.textContent = S.sujo ? 'Alterações não salvas' : 'Salvo'; e.classList.toggle('sujo', S.sujo); }
}

// ---------- cabeçalho ----------
function proximaAcao(o) {
  if (!escreve('ordens.editar')) return null;
  switch (o.status) {
    case 'Recebido': return { t: 'Iniciar diagnóstico', i: 'diagnostico', a: () => mudarStatus('Em análise') };
    case 'Em análise': return escreve('orcamentos.publicar') ? { t: 'Enviar orçamento', i: 'recibo', a: () => { irAba('orcamento'); setTimeout(() => publicarOrcamento(), 50); } } : null;
    case 'Aguardando aprovação': { const p = OS.orcs.find(b => b.status === 'pendente'); return p ? { t: 'Registrar resposta do cliente', i: 'check', a: () => decidirBalcao(p) } : { t: 'Iniciar manutenção', i: 'ferramenta', a: () => mudarStatus('Em conserto') }; }
    case 'Aguardando peça': return { t: 'Peça chegou: iniciar manutenção', i: 'ferramenta', a: () => mudarStatus('Em conserto') };
    case 'Em conserto': return { t: 'Marcar como pronto', i: 'check', a: () => mudarStatus('Pronto') };
    case 'Pronto': return { t: 'Entregar ao cliente', i: 'check', a: () => mudarStatus('Entregue') };
    case 'Entregue': return o.garantia_ate && o.garantia_ate >= hojeISO() ? { t: 'Abrir retorno de garantia', i: 'garantia', a: () => { location.hash = '#/ordens/nova?retorno=' + o.id; } } : null;
    default: return null;
  }
}

function cabecalhoOS() {
  const o = OS.o, prox = proximaAcao(o);
  const idx = FLUXO.indexOf(o.status), cancel = o.status === 'Cancelado';
  const dias = diasDesde(o.status_desde), atras = atrasada(o);
  const ro = !escreve('ordens.editar');
  return `<div class="card os-topo">
    <div class="between"><a class="link" href="#/ordens">${ico('esq', 'sm')} Ordens</a>
      <div class="os-acoes">
        <button class="btn sm" type="button" id="os-whats">${ico('whats', 'sm')} WhatsApp</button>
        ${pode('ordens.editar') && recurso('portal') ? `<button class="btn sm" type="button" id="os-link">${ico('link', 'sm')} Link do cliente</button>` : ''}
        <button class="btn sm" type="button" id="os-doc">${ico('imprimir', 'sm')} Documento</button>
        <button class="btn sm icon" type="button" id="os-mais" aria-label="Mais ações">${ico('pontos', 'sm')}</button>
      </div></div>
    <div class="os-id"><div class="os-num">OS <span>${nOS(o.numero)}</span></div>
      <div class="row">${pillStatus(o.status)}${o.ordem_origem_id ? '<span class="pill warn nodot">Retorno de garantia</span>' : ''}${atras ? '<span class="pill bad">Atrasada</span>' : ''}${ro ? '<span class="pill nodot">Somente consulta</span>' : ''}</div></div>
    <p class="os-quem">${esc(o.cliente_nome || 'Cliente sem nome')} <span>· ${esc([o.marca, o.modelo].filter(Boolean).join(' ') || o.tipo_aparelho)}</span></p>
    <div class="os-meta">
      <span>Aberta <b>${dataHoraBR(o.criado_em)}</b>${o.user_id && nomeMembro(o.user_id) ? ` por ${esc(nomeMembro(o.user_id))}` : ''}</span>
      ${o.status === 'Entregue' ? `<span>Entregue <b>${dataBR(o.data_entrega)}</b></span>` : `<span>Previsão <b style="${atras ? 'color:var(--bad)' : ''}">${o.data_previsao ? dataBR(o.data_previsao) : 'não definida'}</b></span>`}
      <span>Técnico <b>${esc(nomeMembro(o.tecnico_id) || 'não definido')}</b></span>
      ${ABERTOS.includes(o.status) ? `<span>Neste status há <b>${dias} dia${dias === 1 ? '' : 's'}</b></span>` : ''}
    </div>
    ${cancel ? '' : `<div class="passos" aria-label="Andamento">${FLUXO.map((s, i) => `<div class="passo ${i < idx ? 'feito' : ''} ${i === idx ? 'atual' : ''}" title="${esc(rotulo(s))}"><i></i><span>${esc(st(s).curto)}</span></div>`).join('')}</div>`}
    ${escreve('ordens.editar') ? `<div class="row">
      ${prox ? `<button class="btn pri" type="button" id="os-prox">${ico(prox.i, 'sm')} ${esc(prox.t)}</button>` : ''}
      <button class="btn" type="button" id="os-status">Mudar status ${ico('baixo', 'sm')}</button>
    </div>` : ''}
  </div>`;
}

function abasOS() {
  const pend = OS.orcs.some(b => b.status === 'pendente');
  const saldo = num(OS.o.saldo);

    ['pagamentos', 'Pagamentos', saldo > 0.009 && OS.o.total > 0 && OS.o.status !== 'Cancelado' ? '$' : ''], ['historico', 'Histórico']];

function linhasItens() {
  const itens = OS.o.itens || [];

  return itens.map((it, i) => {
    const fixo = it.preco !== undefined && it.preco !== null && it.preco !== '';
    const peca = it.peca_id && S.pecas ? S.pecas.find(p => p.id === it.peca_id) : null;
    return `<tr>
      <td><input aria-label="Peça" data-item="${i}" data-k="nome" maxlength="80" value="${esc(it.nome)}" placeholder="Ex.: Bateria">${it.peca_id ? `<span class="estoque-tag">${ico('estoque', 'sm')} do estoque${peca ? ` · ${peca.quantidade} disponível` : ''}</span>` : ''}</td>
      <td><input aria-label="Quantidade" data-item="${i}" data-k="qtd" type="number" min="1" max="999" inputmode="numeric" value="${esc(it.qtd || 1)}"></td>
      <td><input aria-label="Custo unitário" data-item="${i}" data-k="custo" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(it.custo)}" placeholder="0,00"></td>
      <td><input aria-label="Lucro %" data-item="${i}" data-k="margem" type="number" min="0" max="1000" step="1" inputmode="numeric" value="${esc(fixo ? '' : it.margem)}" placeholder="${fixo ? 'fixo' : ''}"></td>
      <td><input aria-label="Preço unitário" data-item="${i}" data-k="preco" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(fixo ? it.preco : '')}" placeholder="${esc(precoItem(it).toFixed(2))}" style="text-align:right"></td>
      <td class="num" id="item-total-${i}">${brl(precoItem(it) * (num(it.qtd) || 1))}</td>
      <td><button type="button" class="btn ghost icon sm del" data-rm-item="${i}" aria-label="Remover peça">${ico('x', 'sm')}</button></td></tr>`;
  }).join('');
}

function calcularOS() {
  if (!$('#k-total')) return;
  (OS.o.itens || []).forEach((it, i) => { const c = $('#item-total-' + i); if (c) c.textContent = brl(precoItem(it) * (num(it.qtd) || 1)); });
  const v = valoresOS(OS.o);
  $('#k-custo').textContent = brl(v.custo); $('#k-lucro').textContent = brl(v.lucro);
  $('#k-lucro-box').classList.toggle('alerta', v.lucro < 0); $('#k-lucro-box').classList.toggle('verde', v.lucro >= 0);
  $('#k-margem').textContent = v.margem === null ? '—' : Math.round(v.margem) + '%';
  $('#k-total').textContent = brl(v.total);
  $('#k-explica').textContent = [v.valorTaxa > 0 ? `A taxa da maquininha (${brl(v.valorTaxa)}) já está somada ao preço, para não sair do seu lucro.` : '',
    v.lucro < 0 ? 'Atenção: com esse desconto a ordem dá prejuízo.' : '', 'Lucro estimado = preço − custo das peças − taxa. Não inclui aluguel, salários e outras despesas.'].filter(Boolean).join(' ');

function abaPagamentos() {
  const o = OS.o, saldo = Math.max(0, num(o.total) - num(o.recebido));
  const podeReceber = escreve('recebimentos.registrar') && o.status !== 'Cancelado';
  return `<div class="card"><h2>Resumo</h2><div class="valores">
      <div class="lin"><span>Total da OS</span><b>${brl(o.total)}</b></div>
      <div class="lin"><span>Recebido</span><b>${brl(o.recebido)}</b></div>
      <div class="lin total"><span>Falta receber</span><b>${brl(o.status === 'Cancelado' ? 0 : saldo)}</b></div></div>
      ${S.sujo ? '<p class="hint">Há alterações não salvas nos valores. Salve antes de receber.</p>' : ''}</div>
    <div class="card"><div class="card-cab"><h2>Lançamentos</h2>${podeReceber ? `<button type="button" class="btn pri sm" id="os-receber">${ico('dinheiro', 'sm')} Registrar pagamento</button>` : ''}</div>
      ${OS.recs.length ? `<div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Tipo</th><th>Forma</th><th>Quem lançou</th><th class="num">Valor</th><th></th></tr></thead><tbody>
        ${OS.recs.map(x => `<tr><td>${dataBR(x.recebido_em)}</td><td>${{ sinal: 'Sinal', pagamento: 'Pagamento', estorno: 'Estorno' }[x.tipo]}${x.origem === 'migracao' ? ' <small class="faint">(migração)</small>' : ''}</td><td>${esc(x.forma)}</td>
          <td class="muted">${esc(nomeMembro(x.criado_por) || (x.origem === 'migracao' ? 'Sistema' : '—'))}</td><td class="num" style="${x.tipo === 'estorno' ? 'color:var(--bad)' : ''}">${x.tipo === 'estorno' ? '−' : ''}${brl(x.valor)}</td>
          <td>${x.tipo !== 'estorno' && escreve('recebimentos.estornar') ? `<button type="button" class="btn ghost sm" data-estornar="${esc(x.id)}">Estornar</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div>` : '<p class="muted" style="margin:0">Nenhum pagamento lançado. Registre o sinal na entrada e o restante na entrega.</p>'}
      <p class="hint">Lançamentos não são apagados: para corrigir, use o estorno. Assim o caixa fica rastreável.</p>
    </div>`;
}

function abaHistorico() {
  const ev = OS.ev.slice().reverse();
  return `<div class="card"><h2>Histórico <small>registrado pelo sistema, não pode ser editado</small></h2>
    ${ev.length ? `<div class="linha-tempo">${ev.map(e => `<div class="ev"><span class="dot ${e.autor_tipo === 'cliente' ? 'cliente' : e.tipo === 'ordem.status' ? 'status' : ''}">${ico(iconeEvento(e.tipo), 'sm')}</span>
      <div><p>${esc(descreverEvento(e))}</p><small>${esc(autorEvento(e))} · ${dataHoraBR(e.criado_em)}</small></div></div>`).join('')}</div>`
      : '<p class="muted" style="margin:0">Sem eventos registrados.</p>'}</div>`;
}

// ---------- interação ----------
function ligarOS(app) {
  app.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.f) { OS.o[t.dataset.f] = t.value; if (['mao_obra', 'desconto', 'taxa_cartao'].includes(t.dataset.f)) calcularOS(); marcarSujoOS(); }
    else if (t.dataset.item !== undefined) {
      const it = OS.o.itens[+t.dataset.item], k = t.dataset.k;
      if (k === 'preco') { if (t.value === '') delete it.preco; else it.preco = t.value; }
      else { it[k] = t.value; if (k === 'custo' || k === 'margem') { if (k === 'margem') delete it.preco; } }
      if (k === 'margem' || k === 'custo') { const p = $(`[data-item="${t.dataset.item}"][data-k="preco"]`); if (p && it.preco === undefined) p.placeholder = precoItem(it).toFixed(2); }
      calcularOS(); marcarSujoOS();
    }
  });
  app.addEventListener('change', async e => {
    const t = e.target;
    if (t.dataset.check) { const s = new Set(OS.o.checks || []); t.checked ? s.add(t.dataset.check) : s.delete(t.dataset.check); OS.o.checks = [...s]; marcarSujoOS(); }
    else if (t.dataset.teste) { const s = new Set(OS.o.testes_saida || []); t.checked ? s.add(t.dataset.teste) : s.delete(t.dataset.teste); OS.o.testes_saida = [...s]; marcarSujoOS(); }
    else if (t.dataset.f && t.tagName === 'SELECT') { OS.o[t.dataset.f] = t.value; marcarSujoOS(); }
    else if (t.dataset.etapa) { await adicionarFotosOS(t.files, t.dataset.etapa); t.value = ''; }
  });
  app.addEventListener('click', async e => {
    const t = e.target, q = s => t.closest(s);
    if (q('[data-aba]')) { irAba(q('[data-aba]').dataset.aba); return; }
    if (q('#os-salvar-bt')) { await salvarOS(false); return; }
    if (q('#os-descartar')) { if (await confirmar('Descartar as alterações desta OS?', { ok: 'Descartar', perigo: true })) { OS.o = clone(OS.base); OS.fotos = (OS.base.fotos || []).map(f => ({ ...f })); OS.fotosRem = []; S.sujo = false; pintarOS(); } return; }
    if (q('#os-prox')) { const p = proximaAcao(OS.o); if (p) p.a(); return; }
    if (q('#os-status')) { menuStatus(q('#os-status')); return; }
    if (q('#os-whats')) { menuWhats(q('#os-whats')); return; }
    if (q('#os-link') || q('#os-link2')) { await modalLink(); return; }
    if (q('#os-doc')) { menuDocumento(q('#os-doc')); return; }
    if (q('#os-mais')) { menuMaisOS(q('#os-mais')); return; }
    if (q('[data-tipo-os]')) { OS.o.tipo_aparelho = q('[data-tipo-os]').dataset.tipoOs; marcarSujoOS(); pintarAba(); return; }
    if (q('[data-modelo]')) { const b = q('[data-modelo]'), m = S.modelos.find(x => x.id === b.dataset.modelo); if (m) aplicarModelo(m, b.dataset.alvo); return; }
    if (q('#os-trocar-cli')) { trocarClienteOS(); return; }
    if (q('#os-add-item')) { (OS.o.itens = OS.o.itens || []).push({ nome: '', qtd: 1, custo: '', margem: 100 }); $('#os-itens').innerHTML = linhasItens(); calcularOS(); marcarSujoOS(); return; }
    if (q('#os-add-estoque')) { await escolherDoEstoque(); return; }
    if (q('#os-add-servico')) { escolherServico(); return; }
    if (q('[data-rm-item]')) { OS.o.itens.splice(+q('[data-rm-item]').dataset.rmItem, 1); $('#os-itens').innerHTML = linhasItens(); calcularOS(); marcarSujoOS(); return; }
    if (q('[data-margem]')) { (OS.o.itens || []).forEach(it => { if (!it.peca_id) { it.margem = +q('[data-margem]').dataset.margem; delete it.preco; } }); $('#os-itens').innerHTML = linhasItens(); calcularOS(); marcarSujoOS(); return; }
    if (q('#os-publicar')) { await publicarOrcamento(); return; }
    if (q('[data-decidir]')) { await decidirBalcao(OS.orcs.find(b => b.id === q('[data-decidir]').dataset.decidir)); return; }
    if (q('[data-reenviar]')) { await enviarMensagem(MENSAGENS_PADRAO[1].conteudo); return; }
    if (q('[data-rm-foto]')) { const i = +q('[data-rm-foto]').dataset.rmFoto; const [f] = OS.fotos.splice(i, 1); if (f && f.path) OS.fotosRem.push(f.path); pintarFotos(); marcarSujoOS(); return; }
    if (q('[data-foto]')) { const img = q('[data-foto]'); if (img.src) ampliarFoto(img.src); return; }
    if (q('#os-assinar')) { coletarAssinatura(); return; }
    if (q('#os-receber')) { await registrarPagamento(); return; }
    if (q('[data-estornar]')) { await estornar(OS.recs.find(x => x.id === q('[data-estornar]').dataset.estornar)); return; }
  });
}

function aplicarModelo(m, alvo) {
  const atual = String(OS.o[alvo] || '').trim();
  OS.o[alvo] = (atual ? atual + '\n' : '') + m.conteudo;
  if (m.tipo === 'servico') {
    if (num(m.dados.mao_obra) > 0 && !num(OS.o.mao_obra)) OS.o.mao_obra = num(m.dados.mao_obra);
    if (m.dados.garantia !== undefined && m.dados.garantia !== null && m.dados.garantia !== '') OS.o.garantia = num(m.dados.garantia);
  }
  marcarSujoOS(); pintarAba();
}

function trocarClienteOS() {
  let res = [];
  const m = modal({ titulo: 'Trocar cliente', form: false, corpo: `<div class="input-ico">${ico('busca', 'sm')}<input id="tc-busca" type="search" placeholder="Nome ou telefone" autocomplete="off"></div><div class="sugestoes" id="tc-sug"></div>` });
  m.$('#tc-busca').addEventListener('input', debounce(async e => {
    res = await API.buscarClientes(empId(), e.target.value).catch(() => []);
    m.$('#tc-sug').innerHTML = res.map((c, i) => `<button type="button" class="sugestao" data-i="${i}"><span>${esc(c.nome)}</span><small>${esc(c.telefone || '')}</small></button>`).join('') || '<p class="hint">Nenhum cliente encontrado.</p>';
  }, 250));
  m.$('#tc-sug').addEventListener('click', e => {
    const b = e.target.closest('[data-i]'); if (!b) return;
    const c = res[+b.dataset.i];
    Object.assign(OS.o, { cliente_id: c.id, cliente_nome: c.nome, cliente_tel: c.telefone, cliente_doc: c.documento || '', cliente_email: c.email || '' });
    m.fechar(); marcarSujoOS(); pintarAba(); toast('Cliente trocado. Salve para confirmar.');
  });
}

async function escolherDoEstoque() {
  if (!S.pecas) { try { S.pecas = await API.pecas(empId()); } catch (e) { toast(msgErro(e), true); return; } }
  const ativas = S.pecas.filter(p => p.ativo);
  const m = modal({ titulo: 'Peça do estoque', form: false, corpo: `<div class="input-ico">${ico('busca', 'sm')}<input id="pe-busca" type="search" placeholder="Nome, código ou modelo compatível" autocomplete="off"></div><div class="sugestoes" id="pe-lista" style="max-height:50vh;overflow:auto"></div>
    ${ativas.length ? '' : '<p class="hint">Nenhuma peça cadastrada. Cadastre em Estoque.</p>'}` });
  const pintar = t => {
    const tt = t.trim().toLowerCase();
    const l = ativas.filter(p => !tt || [p.nome, p.codigo, p.compativel].join(' ').toLowerCase().includes(tt)).slice(0, 40);
    m.$('#pe-lista').innerHTML = l.map(p => `<button type="button" class="sugestao" data-p="${esc(p.id)}"><span>${esc(p.nome)}${p.codigo ? ` <small>${esc(p.codigo)}</small>` : ''}</span>
      <small style="${p.quantidade <= 0 ? 'color:var(--bad)' : ''}">${p.quantidade} em estoque · ${brl(p.preco)}</small></button>`).join('') || '<p class="hint">Nada encontrado.</p>';
  };
  m.$('#pe-busca').addEventListener('input', e => pintar(e.target.value));
  m.$('#pe-lista').addEventListener('click', e => {
    const b = e.target.closest('[data-p]'); if (!b) return;
    const p = S.pecas.find(x => x.id === b.dataset.p);
    const item = { nome: p.nome, qtd: 1, custo: num(p.custo), margem: num(p.custo) > 0 ? Math.max(0, Math.round((num(p.preco) / num(p.custo) - 1) * 100)) : 0, peca_id: p.id };
    if (num(p.preco) > 0) item.preco = num(p.preco);
    (OS.o.itens = OS.o.itens || []).push(item);
    m.fechar(); $('#os-itens').innerHTML = linhasItens(); calcularOS(); marcarSujoOS();
    if (p.quantidade <= 0) toast('Atenção: essa peça está sem saldo no estoque.', true);
  });
  pintar('');
}

function escolherServico() {
  const ms = modelosDe('servico');
  const m = modal({ titulo: 'Serviço frequente', form: false, corpo: `<div class="sugestoes">${ms.map(x => `<button type="button" class="sugestao" data-s="${esc(x.id)}"><span>${esc(x.titulo)}</span><small>${num(x.dados.mao_obra) ? 'mão de obra ' + brl(x.dados.mao_obra) : ''}</small></button>`).join('')}</div>` });
  m.el.addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (!b) return; const s = ms.find(x => x.id === b.dataset.s);
    OS.o.mao_obra = num(s.dados.mao_obra) || OS.o.mao_obra; if (s.dados.garantia !== undefined && s.dados.garantia !== '') OS.o.garantia = num(s.dados.garantia);
    OS.o.reparo = (String(OS.o.reparo || '').trim() ? OS.o.reparo.trim() + '\n' : '') + s.conteudo; m.fechar(); pintarAba(); marcarSujoOS(); toast('Serviço aplicado: mão de obra e descrição preenchidas.'); });
}

async function adicionarFotosOS(arquivos, etapa) {
  const lista = [...arquivos].filter(f => f.type.startsWith('image/'));
  const livre = 30 - OS.fotos.length;
  if (lista.length > livre) toast(`Limite de 30 fotos por ordem. ${livre > 0 ? `Só ${livre} serão adicionadas.` : ''}`, true);
  for (const arq of lista.slice(0, Math.max(0, livre))) {
    try { const c = await comprimir(arq); OS.fotos.push({ nova: true, blob: c.blob, url: URL.createObjectURL(c.blob), w: c.w, h: c.h, etapa }); }
    catch { toast(`Não consegui abrir "${arq.name}".`, true); }
  }
  pintarFotos(); marcarSujoOS();
}

// ---------- salvar ----------
async function salvarOS(silencioso) {
  if (!OS.o || !escreve('ordens.editar')) return;
  if (!S.sujo) { if (!silencioso) toast('Nada para salvar'); return; }
  const o = OS.o;
  if (!String(o.cliente_nome || '').trim() && !String(o.modelo || '').trim()) { if (!silencioso) toast('Preencha o nome do cliente ou o modelo do aparelho.', true); return; }
  const bt = $('#os-salvar-bt'); if (bt) { bt.disabled = true; bt.textContent = 'Salvando…'; }
  try {
    for (const f of OS.fotos.filter(f => f.nova)) {
      const path = `${empId()}/${o.id}/${f.etapa || 'entrada'}-${Date.now().toString(36)}-${chaveUnica('f').slice(-8)}.jpg`;
      await API.enviarArquivo('os-fotos', path, f.blob);
      f.path = path; f.nova = false; OS.imgs.set(path, Promise.resolve(f.url));
    }
    const dados = dadosOS(o);
    dados.fotos = OS.fotos.filter(f => f.path).map(f => ({ path: f.path, w: f.w, h: f.h, etapa: f.etapa || 'entrada' }));
    const salvo = await API.salvarOrdem(o.id, dados);
    // só apaga as fotos removidas depois que a ordem foi salva sem elas
    if (OS.fotosRem.length) { try { await API.apagarArquivos('os-fotos', OS.fotosRem); } catch { } OS.fotosRem = []; }
    OS.o = clone(salvo); OS.base = clone(salvo); OS.fotos = (salvo.fotos || []).map(f => ({ ...f }));
    baseAssinatura = assinaturaOS(); S.sujo = false;
    OS.ev = await API.eventos(o.id).catch(() => OS.ev);
    if (!silencioso) { toast(`OS nº ${nOS(salvo.numero)} salva`); pintarOS(); }
    recarregarAbertas();
  } catch (e) { toast(msgErro(e), true); throw e; }
  finally { const b2 = $('#os-salvar-bt'); if (b2) { b2.disabled = false; b2.innerHTML = `${ico('check', 'sm')} Salvar alterações`; } }
}
async function garantirSalva() { if (S.sujo) { await salvarOS(true); } return !S.sujo; }
async function recarregarOS() {
  const o = await API.ordem(OS.o.id);
  OS.o = clone(o); OS.base = clone(o); OS.fotos = (o.fotos || []).map(f => ({ ...f })); OS.fotosRem = [];
  await carregarExtrasOS(); baseAssinatura = assinaturaOS(); S.sujo = false; pintarOS(); recarregarAbertas();
}

// ---------- status ----------
function menuStatus(bt) {
  const atual = OS.o.status;
  abrirMenu(bt, STATUS.filter(s => s.v !== atual).map(s => ({ texto: s.r, acao: () => mudarStatus(s.v), perigo: s.v === 'Cancelado',
    desativado: ['Entregue', 'Cancelado'].includes(atual) && !pode('ordens.reabrir') })));
}
async function mudarStatus(novo) {
  try { if (!await garantirSalva()) return; } catch { return; }
  const o = OS.o;
  if (['Entregue', 'Cancelado'].includes(o.status) && !pode('ordens.reabrir')) { toast('Só o proprietário ou um administrador reabre uma ordem encerrada.', true); return; }
  if (novo === 'Entregue') return modalEntrega();
  if (novo === 'Cancelado') {
    const temPeca = (o.itens || []).some(i => i.peca_id);
    if (!await confirmar(`Cancelar a OS nº ${nOS(o.numero)}?${temPeca ? ' As peças do estoque voltam para o saldo.' : ''}`, { ok: 'Cancelar OS', perigo: true, cancelar: 'Voltar' })) return;
  }
  if (['Entregue', 'Cancelado'].includes(o.status) && !await confirmar(`Reabrir a OS nº ${nOS(o.numero)} como "${rotulo(novo)}"? A reabertura fica registrada no histórico.`, { ok: 'Reabrir' })) return;
  try {
    await API.salvarOrdem(o.id, { status: novo });
    toast(`Status: ${rotulo(novo)}`);
    await recarregarOS();
    if (novo === 'Pronto' && telWhats(OS.o.cliente_tel)) {
      if (await confirmar('Avisar o cliente pelo WhatsApp que o aparelho está pronto?', { ok: 'Avisar', cancelar: 'Agora não' })) enviarMensagem(MENSAGENS_PADRAO[3].conteudo);
    }
  } catch (e) { toast(msgErro(e), true); }
}

function modalEntrega() {
  const o = OS.o, saldo = Math.max(0, num(o.total) - num(o.recebido));
  const podeReceber = escreve('recebimentos.registrar');
  const exigir = !!cfg('exigir_quitacao_entrega');
  const testes = (o.testes_saida || []).length;
  modal({
    titulo: `Entregar OS nº ${nOS(o.numero)}`,
    corpo: `<div class="valores"><div class="lin"><span>Total</span><b>${brl(o.total)}</b></div><div class="lin"><span>Já recebido</span><b>${brl(o.recebido)}</b></div>
        <div class="lin total"><span>Falta receber</span><b>${brl(saldo)}</b></div></div>
      ${saldo > 0.009 && podeReceber ? `<label class="check"><input type="checkbox" id="en-receber" checked> Receber ${brl(saldo)} agora</label>
        <div class="g g2">${campo('en-valor', 'Valor recebido (R$)', saldo.toFixed(2), 'type="number" min="0" step="0.01" inputmode="decimal"')}${selecao('en-forma', 'Forma', PAGAMENTOS, o.forma_pagamento || 'Pix')}</div>` : ''}
      ${saldo > 0.009 && exigir ? '<p class="hint">Esta assistência exige o pagamento completo antes da entrega.</p>' : ''}
      ${!testes ? `<p class="banner" style="margin:0">${ico('alerta', 'sm')}<span>Nenhum teste de saída marcado na aba Diagnóstico.</span></p>` : ''}
      <p class="hint">A garantia de ${o.garantia} dias começa hoje e vai até ${dataBR(somaDias(hojeISO(), num(o.garantia)))}. A senha do aparelho será apagada.</p>
      <label class="check"><input type="checkbox" id="en-doc" checked> Gerar comprovante de entrega</label>`,
    acoes: [{ texto: 'Cancelar' }, { texto: 'Confirmar entrega', tipo: 'pri', submit: true, acao: async m => {
      const receber = m.$('#en-receber') && m.$('#en-receber').checked;
      if (receber) {
        const v = Math.round(num(m.$('#en-valor').value) * 100) / 100;
        if (v <= 0) throw new Error('Digite o valor recebido.');
        await API.receber({ ordem_id: o.id, tipo: 'pagamento', valor: v, forma: m.$('#en-forma').value, chave: chaveUnica('entrega') });
        await API.salvarOrdem(o.id, { forma_pagamento: m.$('#en-forma').value }).catch(() => { });
      }
      await API.salvarOrdem(o.id, { status: 'Entregue' });
      const doc = m.$('#en-doc').checked;
      toast('Aparelho entregue');
      await recarregarOS();
      if (doc) gerarDocumento(cfg('pdf_formato') || 'a4', 'abrir');
    } }]
  });
}

// ---------- orçamento ----------
async function publicarOrcamento() {
  try { if (!await garantirSalva()) return; } catch { return; }
  if (valoresOS(OS.o).total <= 0) { toast('Coloque peças ou mão de obra antes de enviar o orçamento.', true); irAba('orcamento'); return; }
  modal({
    titulo: 'Enviar orçamento',
    corpo: `<div class="valores"><div class="lin total"><span>Total para o cliente</span><b>${brl(OS.o.total)}</b></div></div>
      ${campo('or-prazo', 'Prazo de entrega após aprovação', '', 'maxlength="120" placeholder="Ex.: 2 dias úteis"')}
      ${area('or-cond', 'Condições (opcional)', '', 'maxlength="1000" placeholder="Ex.: peça de primeira linha; validade do orçamento 7 dias"')}
      <p class="hint">Os valores atuais ficam guardados nesta versão. Se mudarem depois, envie uma nova versão: a anterior fica no histórico.</p>`,
    acoes: [{ texto: 'Cancelar' }, { texto: 'Registrar e enviar', tipo: 'pri', submit: true, acao: async m => {
      await API.publicarOrcamento(OS.o.id, m.$('#or-prazo').value, m.$('#or-cond').value);
      toast('Orçamento registrado'); await recarregarOS(); irAba('orcamento');
      if (telWhats(OS.o.cliente_tel)) setTimeout(() => enviarMensagem(MENSAGENS_PADRAO[1].conteudo), 100);
    } }]
  });
}
async function decidirBalcao(b) {
  if (!b) return;
  modal({
    titulo: `Resposta do orçamento v${b.versao}`,
    corpo: `<p>Total: <b>${brl(b.total)}</b></p>
      <div class="opcoes" role="radiogroup"><label class="check"><input type="radio" name="dec" value="aprovado" checked> Cliente aprovou</label><label class="check"><input type="radio" name="dec" value="recusado"> Cliente recusou</label></div>
      ${campo('dc-nome', 'Nome de quem respondeu', OS.o.cliente_nome || '', 'maxlength="120"')}
      ${campo('dc-motivo', 'Observação (opcional)', '', 'maxlength="500" placeholder="Ex.: aprovou por telefone às 15h"')}
      <p class="hint">Fica registrado com data, hora e quem lançou.</p>`,
    acoes: [{ texto: 'Cancelar' }, { texto: 'Registrar', tipo: 'pri', submit: true, acao: async m => {
      const dec = m.$('input[name="dec"]:checked').value;
      await API.decidirOrcamento(b.id, dec, m.$('#dc-nome').value, m.$('#dc-motivo').value);

function coletarAssinatura() {
  const m = modal({
    titulo: 'Assinatura do cliente', largo: true,
    corpo: `<p class="muted">Peça para o cliente conferir os dados e o estado do aparelho e assinar abaixo.</p>
      ${campo('as-nome', 'Nome de quem assina', OS.o.cliente_nome || '', 'maxlength="120"')}
      <canvas class="assinatura-canvas" id="as-canvas" aria-label="Área para assinar"></canvas>`,
    acoes: [{ texto: 'Limpar', acao: () => { limpar(); return false; } }, { texto: 'Cancelar' }, { texto: 'Salvar assinatura', tipo: 'pri', submit: true, acao: async mm => {
      if (!desenhou) throw new Error('A assinatura está vazia.');
      if (!mm.$('#as-nome').value.trim()) throw new Error('Digite o nome de quem assina.');
      try { if (!await garantirSalva()) throw new Error('Salve as alterações da OS antes.'); } catch (e) { throw e; }
      const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
      const path = `${empId()}/${OS.o.id}/assinatura-${Date.now().toString(36)}.png`;
      await API.enviarArquivo('os-fotos', path, blob);
      const antiga = OS.o.assinatura_path;
      await API.salvarOrdem(OS.o.id, { assinatura_path: path, assinatura_nome: mm.$('#as-nome').value.trim(), assinado_em: new Date().toISOString() });
      if (antiga) API.apagarArquivos('os-fotos', [antiga]).catch(() => { });
      OS.imgs.set(path, Promise.resolve(URL.createObjectURL(blob)));
      toast('Assinatura salva'); await recarregarOS(); irAba('fotos');
    } }]
  });
  const cv = m.$('#as-canvas'), ctx = cv.getContext('2d');
  let desenhando = false, desenhou = false;
  const ajustar = () => { const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; ctx.scale(d, d); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, r.width, r.height); };
  const limpar = () => { ajustar(); desenhou = false; };
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', e => { desenhando = true; cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); });
  cv.addEventListener('pointermove', e => { if (!desenhando) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); desenhou = true; });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cv.addEventListener(t, () => { desenhando = false; }));
  setTimeout(ajustar, 30);
}

async function anonimizar(c) {

async function duplicados() {
  const m = modal({ titulo: 'Possíveis duplicados', form: false, largo: true, corpo: carregando('Procurando cadastros parecidos…') });
  try {
    const todos = await API.todosClientesLeve(empId());
    const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
    const grupos = new Map();
    todos.forEach(c => {
      const k1 = c.telefone_digitos && c.telefone_digitos.length >= 10 ? 'tel:' + c.telefone_digitos.slice(-9) : null;
      const k2 = norm(c.nome).length >= 5 ? 'nome:' + norm(c.nome) : null;
      [k1, k2].filter(Boolean).forEach(k => { if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(c); });
    });
    const pares = [], vistos = new Set();
    grupos.forEach((l, k) => { if (l.length < 2) return; const id = l.map(x => x.id).sort().join(); if (vistos.has(id)) return; vistos.add(id); pares.push({ k, l }); });
    const corpo = m.$('.modal-corpo');
    corpo.innerHTML = pares.length ? `<p class="muted">Mesmo telefone ou mesmo nome. Ao mesclar, as ordens passam para o cadastro mantido e o outro é removido.</p>
      ${pares.slice(0, 40).map((p, i) => `<div class="orc"><b>${p.k.startsWith('tel:') ? 'Mesmo telefone' : 'Mesmo nome'}</b>
        ${p.l.map(c => `<div class="between"><span>${esc(c.nome || 'Sem nome')} <small class="muted">atualizado ${tempoRelativo(c.atualizado_em)}</small></span><a class="link" href="#/cliente/${esc(c.id)}">ver</a></div>`).join('')}
        ${p.l.length === 2 ? `<div class="row"><button type="button" class="btn sm" data-mesclar="${i}" data-manter="0">Manter "${esc(p.l[0].nome)}"</button><button type="button" class="btn sm" data-mesclar="${i}" data-manter="1">Manter "${esc(p.l[1].nome)}"</button></div>` : '<small class="faint">Mais de dois cadastros: abra cada um para decidir.</small>'}</div>`).join('')}`
      : vazio('ok', 'Nenhum duplicado encontrado');
    corpo.addEventListener('click', async e => {
      const b = e.target.closest('[data-mesclar]'); if (!b) return;
      const p = pares[+b.dataset.mesclar], manter = p.l[+b.dataset.manter], remover = p.l[1 - b.dataset.manter];
      if (!await confirmar(`Mesclar: manter "${esc(manter.nome)}" e remover "${esc(remover.nome)}"?`, { ok: 'Mesclar' })) return;
      try { await API.mesclarClientes(manter.id, remover.id); toast('Cadastros mesclados'); m.fechar(); rotear(); } catch (er) { toast(msgErro(er), true); }
    });
  } catch (e) { m.$('.modal-corpo').innerHTML = vazio('alerta', 'Não foi possível procurar', esc(msgErro(e))); }
}

// =====================================================================
const PER = { tipo: 'mes' };
function periodo(tipo, ini, fim) {
  const h = hojeISO(), d = new Date(h + 'T12:00:00');
  const iso = x => x.toISOString().slice(0, 10);
  if (tipo === 'mes') return [h.slice(0, 8) + '01', h];
  if (tipo === 'mes_passado') { const a = new Date(d.getFullYear(), d.getMonth() - 1, 1, 12), b = new Date(d.getFullYear(), d.getMonth(), 0, 12); return [iso(a), iso(b)]; }
  if (tipo === '30') return [somaDias(h, -29), h];
  if (tipo === '90') return [somaDias(h, -89), h];
  if (tipo === 'ano') return [h.slice(0, 4) + '-01-01', h];
  return [ini || somaDias(h, -29), fim || h];
}

// só as chaves que o banco aceita
function limparConfig(c) {
  const ok = ['alerta_orcamento_dias', 'alerta_sem_atualizacao_dias', 'alerta_pronto_dias', 'alerta_garantia_dias', 'exigir_quitacao_entrega', 'exigir_aprovacao_orcamento', 'portal_mostrar_valores', 'pdf_formato', 'pdf_fotos', 'pdf_checklist', 'pdf_qr'];
  return Object.fromEntries(Object.entries(c || {}).filter(([k]) => ok.includes(k)));
}

            : '<p class="muted" style="margin:0">Nenhum ainda.</p>'}</div>`; }).join('')}`;
  };

function editarModelo(m, depois) {
  const novo = !m.id, t = m.tipo;
  modal({
    titulo: (novo ? 'Novo: ' : 'Editar: ') + TIPOS_MODELO[t].toLowerCase(),
    corpo: `${campo('md-titulo', 'Nome do botão', m.titulo, 'maxlength="80" placeholder="Ex.: Tela quebrada"')}
      ${t === 'checklist' ? `${selecao('md-tipo', 'Tipo de aparelho', [['', 'Todos'], ...TIPOS], m.dados.tipo_aparelho || '')}${area('md-itens', 'Itens (um por linha)', (m.dados.itens || []).join('\n'), 'maxlength="2000"')}`
        : area('md-conteudo', t === 'mensagem' ? 'Mensagem' : 'Texto', m.conteudo, 'maxlength="4000" style="min-height:120px"')}
      ${t === 'servico' ? `<div class="g g2">${campo('md-mo', 'Mão de obra (R$)', m.dados.mao_obra ?? '', 'type="number" min="0" step="0.01"')}${campo('md-gar', 'Garantia (dias)', m.dados.garantia ?? '', 'type="number" min="0" max="3650"')}</div>` : ''}`,
    acoes: [!novo ? { texto: 'Excluir', tipo: 'del', acao: async () => { if (!await confirmar('Excluir este modelo?', { ok: 'Excluir', perigo: true })) return false; await API.excluirModelo(m.id); S.modelos = await API.modelos(empId()); depois(); toast('Modelo excluído'); } } : null,
      { texto: 'Cancelar' }, { texto: 'Salvar', tipo: 'pri', submit: true, acao: async mm => {
        const titulo = mm.$('#md-titulo').value.trim(); if (!titulo) throw new Error('Digite o nome do botão.');
        const d = { titulo, conteudo: mm.$('#md-conteudo') ? mm.$('#md-conteudo').value.trim() : '', dados: {} };
        if (t === 'checklist') { d.dados = { itens: mm.$('#md-itens').value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 30) }; if (mm.$('#md-tipo').value) d.dados.tipo_aparelho = mm.$('#md-tipo').value; if (!d.dados.itens.length) throw new Error('Digite pelo menos um item.'); }
        if (t === 'servico') { if (mm.$('#md-mo').value !== '') d.dados.mao_obra = Math.max(0, num(mm.$('#md-mo').value)); if (mm.$('#md-gar').value !== '') d.dados.garantia = Math.max(0, Math.round(num(mm.$('#md-gar').value))); }
        if (t !== 'checklist' && !d.conteudo) throw new Error('Digite o texto.');
        if (novo) await API.criarModelo({ empresa_id: empId(), tipo: t, ...d }); else await API.salvarModelo(m.id, d);
        S.modelos = await API.modelos(empId()); depois(); toast('Modelo salvo');
      } }].filter(Boolean)
  });
}

async function exportar(tipo) {
  toast('Preparando arquivo…');
  try {
    const [ordens, clientes] = await Promise.all([SB.select('os_ordens', { select: '*', empresa_id: 'eq.' + empId(), order: 'numero.asc' }), SB.select('os_clientes', { select: 'id,nome,telefone,email,documento,obs,criado_em', empresa_id: 'eq.' + empId() })]);
    const nome = `${S.empresa.nome.normalize('NFD').replace(/[^\w]+/g, '-').toLowerCase()}-${hojeISO()}`;
    if (tipo === 'json') {
      const limpar = o => { const { empresa_id, user_id, senha, fotos, assinatura_path, ...r } = o; return r; };
      baixarArquivo(new Blob([JSON.stringify({ formato: 'forja-os-backup', versao: 2, exportado_em: new Date().toISOString(), assistencia: { nome: S.empresa.nome, documento: S.empresa.documento }, clientes, ordens: ordens.map(limpar) }, null, 2)], { type: 'application/json' }), `backup-${nome}.json`);
    } else {
      const cols = [['numero', 'Nº'], ['status', 'Status'], ['data_entrada', 'Entrada'], ['data_entrega', 'Entrega'], ['cliente_nome', 'Cliente'], ['cliente_tel', 'Telefone'], ['tipo_aparelho', 'Tipo'], ['marca', 'Marca'], ['modelo', 'Modelo'], ['imei', 'IMEI'], ['defeito', 'Defeito'], ['reparo', 'Serviço'], ['total', 'Total'], ['recebido', 'Recebido'], ['custo', 'Custo peças'], ['lucro', 'Lucro estimado']];
      const c = v => `"${String(v ?? '').replace(/"/g, '""').replace(/\n/g, ' ')}"`;
      const csv = '﻿' + [cols.map(x => c(x[1])).join(';'), ...ordens.map(o => cols.map(([k]) => k === 'status' ? c(rotulo(o[k])) : typeof o[k] === 'number' ? String(o[k]).replace('.', ',') : c(o[k])).join(';'))].join('\r\n');
      baixarArquivo(new Blob([csv], { type: 'text/csv;charset=utf-8' }), `ordens-${nome}.csv`);
    }
  } catch (e) { toast(msgErro(e), true); }
}
async function importar(arquivo) {
  let j;
  try { if (arquivo.size > 20e6) throw 0; j = JSON.parse(await arquivo.text()); } catch { return toast('Arquivo inválido. Use um backup .json.', true); }
  const lista = Array.isArray(j) ? j : Array.isArray(j.ordens) ? j.ordens : [];
  if (!lista.length) return toast('Nenhuma ordem encontrada nesse arquivo.', true);
  if (!await confirmar(`Importar ${lista.length} ordem(ns)? Elas ganham números novos e os clientes são reconhecidos pelo telefone.`, { ok: 'Importar' })) return;
  const g = (o, a, b) => o[a] ?? o[b];
  const data = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '') ? s : null;
  const linhas = lista.slice().sort((a, b) => num(a.numero) - num(b.numero)).map(o => {
    const stt = STATUS.some(s => s.v === o.status) ? o.status : 'Recebido';
    const ant = o.numero ? `Importada (nº anterior ${o.numero})` : 'Importada';
    const base = dadosOS({
      cliente_nome: g(o, 'cliente_nome', 'clienteNome') || '', cliente_tel: g(o, 'cliente_tel', 'clienteTel') || '', cliente_doc: g(o, 'cliente_doc', 'clienteDoc') || '', cliente_email: o.cliente_email || '',
      tipo_aparelho: TIPOS.includes(o.tipo_aparelho) ? o.tipo_aparelho : 'Celular', marca: o.marca || '', modelo: o.modelo || '', imei: o.imei || '', cor: o.cor || '', senha: '',
      acessorios: o.acessorios || '', checks: Array.isArray(o.checks) ? o.checks.filter(x => typeof x === 'string').slice(0, 40) : [], defeito: o.defeito || '', diagnostico: o.diagnostico || '',
      reparo: o.reparo || '', obs: [o.obs, ant].filter(Boolean).join(' · ').slice(0, 2000), obs_interna: o.obs_interna || '', testes_saida: Array.isArray(o.testes_saida) ? o.testes_saida.filter(x => typeof x === 'string') : [],
      data_entrada: data(g(o, 'data_entrada', 'dataEntrada')) || hojeISO(), data_previsao: data(g(o, 'data_previsao', 'dataPrevisao')), tecnico_id: null, garantia: o.garantia ?? 90,
      itens: Array.isArray(o.itens) ? o.itens.slice(0, 30).map(i => ({ nome: i.nome, qtd: i.qtd || 1, custo: num(i.custo), margem: num(i.margem), ...(i.preco !== undefined && i.preco !== null ? { preco: i.preco } : {}) })) : [],
      mao_obra: g(o, 'mao_obra', 'maoObra') || 0, desconto: o.desconto || 0, taxa_cartao: g(o, 'taxa_cartao', 'taxaCartao') || 0, forma_pagamento: o.forma_pagamento || '', garantia_decisao: '', garantia_obs: '', cliente_id: null
    });
    const entregue = stt === 'Entregue';
    return { dados: { ...base, empresa_id: empId(), status: stt, data_entrega: entregue ? (data(o.data_entrega) || base.data_entrada) : null },
             pago: entregue ? num(o.recebido !== undefined ? o.recebido : o.total) : 0 };
  });
  try {
    let n = 0;
    for (let i = 0; i < linhas.length; i += 100) {
      const lote = linhas.slice(i, i + 100);
      const criadas = await SB.insert('os_ordens', lote.map(x => x.dados));
      n += criadas.length;
      // ordens entregues no backup: registra o pagamento para não aparecerem como "saldo em aberto"
      for (let k = 0; k < criadas.length; k++) {
        const valor = Math.min(lote[k].pago || num(criadas[k].total), num(criadas[k].total));
        if (criadas[k].status === 'Entregue' && valor > 0 && escreve('recebimentos.registrar')) {
          await API.receber({ ordem_id: criadas[k].id, tipo: 'pagamento', valor: Math.round(valor * 100) / 100, forma: criadas[k].forma_pagamento || 'Não informado', recebido_em: criadas[k].data_entrega, obs: 'Importado do backup', chave: chaveUnica('imp') }).catch(() => { });
        }
      }
    }
    toast(`${n} ordem(ns) importada(s).`); recarregarAbertas();
  } catch (e) { toast(msgErro(e), true); }
}

function pillAss(x, hoje) {
  const d = x.vence_em ? diasEntre(hoje, x.vence_em) : null;
  if (!x.acesso_ativo) return `<span class="pill bad">${x.status === 'pendente' && !x.vence_em ? 'Aguardando liberação' : 'Só consulta'}</span>`;
  if (d !== null && d < 0) return `<span class="pill bad">Atrasada ${-d}d</span>`;
  if (x.status === 'teste') return `<span class="pill info">Teste · ${d}d</span>`;
  if (x.status === 'cancelada') return `<span class="pill warn">Cancelada · até ${dataBR(x.vence_em)}</span>`;
  if (d !== null && d <= 5) return `<span class="pill warn">Vence em ${d}d</span>`;
  return `<span class="pill ok">Em dia</span>`;
}

      corpo: `<div class="g g2">${campo('rp-valor', 'Valor recebido (R$)', x.valor_mensal ?? C.valor_mensal_padrao, 'type="number" min="0" step="0.01"')}${campo('rp-meses', 'Meses pagos', 1, 'type="number" min="1" max="24"')}

        <div class="full">${campo('ea-link', 'Link de pagamento deste assinante (https://…)', x.link_pagamento || '', 'inputmode="url"')}</div>
        ${campo('ea-cus', 'ID do cliente no provedor de cobrança', x.gateway_cliente_id || '', 'maxlength="80" placeholder="cus_..."')}${campo('ea-obs', 'Observação interna', x.observacao || '', 'maxlength="500"')}</div>`,

        const link = m.$('#ea-link').value.trim(); if (link && !linkSeguro(link)) throw new Error('O link precisa começar com https://');
        await API.adminSalvarAssinatura({ p_empresa: x.empresa_id, p_status: m.$('#ea-status').value, p_vence: m.$('#ea-vence').value || null, p_valor: m.$('#ea-valor').value === '' ? null : num(m.$('#ea-valor').value),
          p_link: link, p_obs: m.$('#ea-obs').value, p_gateway_cliente: m.$('#ea-cus').value.trim(), p_plano: m.$('#ea-plano').value });

}

      <span><b>${esc(p.nome)} <small class="faint">(${esc(p.id)})</small></b><small>${p.valor_mensal != null ? brl(p.valor_mensal) + '/mês · ' : ''}usuários ${p.limites.usuarios ?? '∞'} · ordens/mês ${p.limites.ordens_mes ?? '∞'} · ${(p.recursos || []).length} recursos${p.ativo ? '' : ' · inativo'}</small></span>${ico('editar', 'sm')}</button>`).join('')}</div>`;

    modal({

        ${campo('pn-valor', 'Mensalidade (R$)', p.valor_mensal ?? '', 'type="number" min="0" step="0.01"')}${campo('pn-ordem', 'Ordem de exibição', p.ordem, 'type="number"')}

        ${campo('pn-mb', 'Armazenamento de fotos (MB)', p.limites.armazenamento_mb ?? '', 'type="number" min="1"')}${campo('pn-desc', 'Descrição', p.descricao, 'maxlength="300"')}</div>
        <div class="f"><span class="lbl">Recursos</span>${Object.entries(RECURSOS_PLANO).map(([k, t]) => `<label class="check"><input type="checkbox" data-rec="${k}" ${(p.recursos || []).includes(k) ? 'checked' : ''}> ${t}</label>`).join('')}</div>

        else await API.salvarPlano(p.id, d);

      <div class="span2">${campo('c-link_pagamento_padrao', 'Link de pagamento padrão (https://…)', C.link_pagamento_padrao, 'inputmode="url" placeholder="Link do Asaas, Mercado Pago, PagBank…"')}</div></div>
    <div class="row" style="margin-top:12px"><button type="submit" class="btn pri">Salvar configurações</button></div></form>`;

    e.preventDefault();
    const link = $('#c-link_pagamento_padrao', el).value.trim(); if (link && !linkSeguro(link)) return toast('O link de pagamento precisa começar com https://', true);
    try {
      for (const k of ['dias_teste', 'carencia_dias', 'valor_mensal_padrao', 'plano_padrao', 'max_empresas_por_usuario', 'portal_dias', 'whatsapp_suporte', 'link_pagamento_padrao']) {
        let v = $('#c-' + k, el).value.trim();

        if (['dias_teste', 'carencia_dias', 'max_empresas_por_usuario', 'portal_dias'].includes(k)) v = String(Math.max(0, Math.round(num(v))));
        if (k === 'valor_mensal_padrao') v = String(Math.max(0, num(v)));
        if (v !== String(C[k] ?? '')) await API.salvarConfigPlataforma(k, v);
      }
      toast('Configurações salvas'); rotear();
    } catch (er) { toast(msgErro(er), true); }
  });
}

// =====================================================================
