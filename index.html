<style>/* Layout: barra lateral escura fixa + área de trabalho clara; a cor da assistência é o único acento.
   No celular: barra superior + navegação inferior com o botão de nova OS no centro. */
:root {
  --bg: #eef0f3; --surface: #ffffff; --surface-2: #f6f7f9; --surface-3: #eceef2;
  --ink: #15181d; --ink-2: #353b45; --muted: #5d6571; --faint: #8a919b; --line: #d8dce2; --line-2: #e8ebef;
  --side: #14171c; --side-2: #1c2026; --side-ink: #eceef1; --side-muted: #8d949e; --side-line: #262b32;
  --ember: #d9531a; --ember-ink: #ffffff;
  --ember-soft: color-mix(in srgb, var(--ember) 12%, var(--surface));
  --ember-line: color-mix(in srgb, var(--ember) 45%, var(--line));
  --ok: #1d7f47; --ok-soft: #dff2e6; --warn: #8a5a00; --warn-soft: #fbefcd; --bad: #c22f2f; --bad-soft: #fbe2e2;
  --info: #2c5fb5; --info-soft: #e1eaf9; --work: #6b45c9; --work-soft: #ece6fa;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px; --r-sm: 7px; --r-lg: 14px;
  --shadow: 0 1px 2px rgba(16, 20, 26, .06), 0 6px 20px rgba(16, 20, 26, .06);
  --shadow-lg: 0 10px 40px rgba(16, 20, 26, .18);
  --side-w: 236px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #101216; --surface: #191c21; --surface-2: #1f2328; --surface-3: #262a30;
    --ink: #eceef1; --ink-2: #c9cdd3; --muted: #9aa1ab; --faint: #6f7680; --line: #30353c; --line-2: #262a30;
    --side: #0b0d10; --side-2: #15181d; --side-line: #1d2127;
    --ok: #4cc47f; --ok-soft: #163625; --warn: #e6b545; --warn-soft: #3a2f12; --bad: #ff6b6b; --bad-soft: #3d1c1c;
    --info: #7ea6ec; --info-soft: #1b2a43; --work: #a993f0; --work-soft: #2a2244;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101216; --surface: #191c21; --surface-2: #1f2328; --surface-3: #262a30;
  --ink: #eceef1; --ink-2: #c9cdd3; --muted: #9aa1ab; --faint: #6f7680; --line: #30353c; --line-2: #262a30;
  --side: #0b0d10; --side-2: #15181d; --side-line: #1d2127;
  --ok: #4cc47f; --ok-soft: #163625; --warn: #e6b545; --warn-soft: #3a2f12; --bad: #ff6b6b; --bad-soft: #3d1c1c;
  --info: #7ea6ec; --info-soft: #1b2a43; --work: #a993f0; --work-soft: #2a2244;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body);
  -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
[hidden] { display: none !important; }
a { color: inherit; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { text-wrap: balance; }
.ico { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico.sm { width: 16px; height: 16px; }
.ico.lg { width: 28px; height: 28px; }

/* ---------- casca do app ---------- */
.app { min-height: 100vh; }
.side { position: fixed; inset: 0 auto 0 0; width: var(--side-w); background: var(--side); color: var(--side-ink);
  display: flex; flex-direction: column; z-index: 40; padding: calc(14px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--side-line); }
.side-brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; min-width: 0; }
.side-brand img { width: 34px; height: 34px; object-fit: contain; border-radius: 8px; background: #fff; flex: none; }
.side-brand .mono-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--ember); color: var(--ember-ink);
  display: grid; place-items: center; font: 700 18px/1 var(--display); flex: none; }
.side-brand > span { min-width: 0; }
.side-brand b { display: block; font: 700 21px/1.05 var(--display); letter-spacing: .03em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-brand small { display: block; font-size: 11.5px; color: var(--side-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-nova { margin: 2px 4px 14px; }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px; text-decoration: none;
  color: var(--side-muted); font-weight: 500; font-size: 14.5px; }
.nav a:hover { background: var(--side-2); color: var(--side-ink); }
.nav a[aria-current="page"] { background: var(--side-2); color: var(--side-ink); box-shadow: inset 3px 0 0 var(--ember); }
.nav a .badge { margin-left: auto; }
.nav-sep { height: 1px; background: var(--side-line); margin: 10px 6px; }
.side-foot { margin-top: auto; display: grid; gap: 6px; border-top: 1px solid var(--side-line); padding-top: 12px; }
.side-user { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; background: none; border: 0;
  color: var(--side-ink); cursor: pointer; text-align: left; width: 100%; }
.side-user:hover { background: var(--side-2); }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--side-2); color: var(--side-ink); display: grid; place-items: center;
  font: 600 12px/1 var(--body); flex: none; border: 1px solid var(--side-line); }
.side-user span { min-width: 0; }
.side-user b { display: block; font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-user small { display: block; font-size: 11.5px; color: var(--side-muted); }

.main { margin-left: var(--side-w); min-height: 100vh; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2);
  padding-top: env(safe-area-inset-top, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 1280px; margin: 0 auto; min-height: 60px; display: flex; align-items: center; gap: 12px; }
.top-brand { display: none; align-items: center; gap: 8px; min-width: 0; color: inherit; text-decoration: none; font: 700 20px/1 var(--display); letter-spacing: .03em; text-transform: uppercase; }
.top-brand img { width: 28px; height: 28px; border-radius: 6px; object-fit: contain; background: #fff; }
.top-brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.busca-btn { flex: 1; max-width: 520px; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line);
  border-radius: 9px; background: var(--surface); color: var(--faint); cursor: text; text-align: left; min-height: 42px; }
.busca-btn kbd { margin-left: auto; font: 500 11px/1 var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; color: var(--muted); }
.top-acoes { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.wrap { flex: 1; padding-block: 20px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; min-width: 0; }
.page > * { min-width: 0; }

.bottom { display: none; }

/* ---------- avisos e cabeçalhos ---------- */
.banner { max-width: 1280px; margin: 14px auto 0; padding: 11px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--warn);
  font-weight: 500; display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.banner > span { flex: 1 1 260px; }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner.info { background: var(--info-soft); color: var(--info); }
.banner .btn { flex: none; }
.cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; }
.cab > div { min-width: 0; }
.h1 { font: 700 30px/1.05 var(--display); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 72ch; font-size: 14.5px; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.cab-acoes { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- blocos ---------- */
.card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card h2, .h2 { margin: 0 0 12px; font: 600 19px/1.15 var(--display); letter-spacing: .04em; text-transform: uppercase; display: flex;
  align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card h2 small, .h2 small { font: 500 12.5px/1.3 var(--body); letter-spacing: 0; text-transform: none; color: var(--muted); }
.card.interno { background: var(--surface-2); border-style: dashed; border-color: var(--line); box-shadow: none; }
.card-cab { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-cab h2 { margin: 0; }
.cols { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.cols-3 { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
.cols-main { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.65fr) minmax(300px, 1fr); align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.divider { height: 1px; background: var(--line-2); margin: 4px 0; }

/* ---------- formulários ---------- */
.g { display: grid; gap: 12px 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g .full { grid-column: 1 / -1; }
.g .span2 { grid-column: span 2; }
.f { display: grid; gap: 5px; align-content: start; min-width: 0; }
.f > label, .lbl { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.f .ajuda { font-size: 12px; color: var(--faint); }
input, select, textarea { width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface);
  min-height: 42px; transition: border-color .12s; }
input:hover, select:hover, textarea:hover { border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
input[type="checkbox"], input[type="radio"] { width: 18px; height: 18px; min-height: 0; accent-color: var(--ember); padding: 0; flex: none; }
input[type="color"] { padding: 3px; width: 52px; height: 42px; cursor: pointer; }
textarea { min-height: 84px; resize: vertical; line-height: 1.45; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--ember); outline-offset: 1px; }
input:disabled, select:disabled, textarea:disabled { background: var(--surface-2); color: var(--muted); cursor: not-allowed; }
.input-ico { position: relative; }
.input-ico .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.input-ico input { padding-left: 38px; }
.check { display: flex; align-items: center; gap: 9px; font-size: 14px; cursor: pointer; min-height: 32px; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 14px; }
.opcoes { display: flex; gap: 6px; flex-wrap: wrap; }
.opcao { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 13px; font-size: 13.5px; cursor: pointer;
  color: var(--ink-2); min-height: 34px; }
.opcao:hover { border-color: var(--muted); }
.opcao[aria-pressed="true"] { border-color: var(--ember); background: var(--ember-soft); color: var(--ink); font-weight: 600; }
.erro-txt { color: var(--bad); font-size: 13px; margin: 0; min-height: 1em; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }

/* ---------- botões ---------- */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 15px; font-weight: 600; font-size: 14px;
  cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 7px; color: var(--ink);
  min-height: 42px; white-space: nowrap; transition: background .12s, border-color .12s, filter .12s; }
.btn:hover { border-color: color-mix(in srgb, var(--ink) 30%, var(--line)); background: var(--surface-2); }
.btn.pri { background: var(--ember); border-color: var(--ember); color: var(--ember-ink); }
.btn.pri:hover { filter: brightness(1.07); background: var(--ember); }
.btn.ghost { background: none; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-3); }
.btn.del { color: var(--bad); }
.btn.del.armado { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.sm { min-height: 34px; padding: 6px 11px; font-size: 13px; border-radius: 7px; }
.btn.icon { padding: 0; width: 42px; }
.btn.icon.sm { width: 34px; }
.btn.full { width: 100%; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; pointer-events: none; }
.side .btn { border-color: var(--side-line); background: var(--side-2); color: var(--side-ink); }
.side .btn.pri { background: var(--ember); border-color: var(--ember); color: var(--ember-ink); }
.link { background: none; border: 0; color: var(--ember); cursor: pointer; padding: 4px 2px; font-weight: 600; text-decoration: none; }
.link:hover { text-decoration: underline; }

/* ---------- chips, pílulas, contadores ---------- */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 13px; cursor: pointer;
  color: var(--muted); display: inline-flex; gap: 6px; align-items: center; min-height: 34px; }
.chip b { font-weight: 600; color: var(--ink-2); font-family: var(--mono); font-size: 12px; }
.chip[aria-pressed="true"] { border-color: var(--ember); color: var(--ink); background: var(--ember-soft); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px;
  white-space: nowrap; background: var(--surface-3); color: var(--muted); line-height: 1.6; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; }
.pill.nodot::before { display: none; }
.pill.s-recebido, .pill.s-analise, .pill.info { background: var(--info-soft); color: var(--info); }
.pill.s-aprovacao, .pill.s-peca, .pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.s-conserto { background: var(--work-soft); color: var(--work); }
.pill.s-pronto, .pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.s-entregue { background: var(--surface-3); color: var(--muted); }
.pill.s-cancelado, .pill.bad { background: var(--bad-soft); color: var(--bad); }
.badge { min-width: 20px; height: 20px; border-radius: 99px; padding: 0 6px; display: inline-grid; place-items: center; font: 600 11px/1 var(--mono);
  background: var(--ember); color: var(--ember-ink); }
.badge.quieto { background: var(--side-2); color: var(--side-muted); border: 1px solid var(--side-line); }

/* ---------- números ---------- */
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); padding: 14px 16px; min-width: 0; box-shadow: var(--shadow);
  display: grid; gap: 2px; text-decoration: none; color: inherit; }
a.kpi:hover, button.kpi:hover { border-color: var(--ember-line); }
button.kpi { text-align: left; cursor: pointer; font: inherit; }
.kpi small { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.kpi b { font: 500 25px/1.15 var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; letter-spacing: -.01em; }
.kpi span { font-size: 12.5px; color: var(--muted); }
.kpi.acento b { color: var(--ember); }
.kpi.verde b { color: var(--ok); }
.kpi.alerta { border-color: color-mix(in srgb, var(--bad) 35%, var(--line-2)); }
.kpi.alerta b { color: var(--bad); }
.valores { display: grid; gap: 0; }
.valores .lin { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line-2); font-size: 14px; }
.valores .lin:last-child { border-bottom: 0; }
.valores .lin b, .valores .lin .num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 500; }
.valores .lin.total { font-weight: 600; font-size: 16px; padding-top: 10px; }
.valores .lin.total b { color: var(--ember); font-size: 19px; }

/* ---------- painel ---------- */
.fluxo { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.etapa { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: 12px; text-decoration: none; color: inherit;
  display: grid; gap: 4px; box-shadow: var(--shadow); position: relative; min-width: 0; }
.etapa:hover { border-color: var(--ember-line); }
.etapa b { font: 500 26px/1 var(--mono); }
.etapa span { font-size: 12.5px; color: var(--muted); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.etapa i { position: absolute; left: 12px; right: 12px; top: 0; height: 3px; border-radius: 0 0 3px 3px; background: var(--c, var(--line)); }
.alertas { display: grid; gap: 6px; }
.alerta-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 12px;
  border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); text-decoration: none; color: inherit; }
.alerta-item:hover { border-color: var(--ember-line); }
.alerta-item .ico { color: var(--warn); }
.alerta-item.bad .ico { color: var(--bad); }
.alerta-item.ok .ico { color: var(--ok); }
.alerta-item.info .ico { color: var(--info); }
.alerta-item b { font-weight: 600; font-size: 14px; }
.alerta-item small { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.atividade { display: grid; gap: 0; }
.atv { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-2); text-decoration: none; color: inherit; }
.atv:last-child { border-bottom: 0; }
.atv .dot { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; color: var(--muted); }
.atv p { margin: 0; font-size: 13.5px; }
.atv small { color: var(--faint); font-size: 12px; }
.acoes-rapidas { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.acao-rapida { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: var(--r); border: 1px solid var(--line-2);
  background: var(--surface); text-decoration: none; color: inherit; font-weight: 600; font-size: 14px; cursor: pointer; text-align: left; }
.acao-rapida:hover { border-color: var(--ember-line); }
.acao-rapida .ico { color: var(--ember); }

/* ---------- listas (tabela no computador, cartões no celular) ---------- */
.lista { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.lista-cab, .item { display: grid; grid-template-columns: 74px minmax(0, 1.4fr) minmax(0, 1.2fr) 168px 110px minmax(0, .8fr) 112px; gap: 12px; align-items: center; padding: 11px 16px; }
.lista-cab { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line-2); }
.item { border-bottom: 1px solid var(--line-2); text-decoration: none; color: inherit; font-size: 14px; }
.item:last-child { border-bottom: 0; }
.item:hover { background: var(--surface-2); }
.item .n { font-family: var(--mono); color: var(--ember); font-weight: 500; }
.item .c b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .c small, .item .a small { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .v { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.item .v small { display: block; font-size: 11.5px; color: var(--bad); }
.item .p.atrasada { color: var(--bad); font-weight: 600; }
.item .t { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lista-pe { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px; background: var(--surface-2); font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.vazio { color: var(--muted); padding: 34px 18px; text-align: center; display: grid; gap: 8px; justify-items: center; }
.vazio .ico { width: 34px; height: 34px; color: var(--faint); stroke-width: 1.4; }
.vazio b { color: var(--ink); font-size: 15px; }
.carregando { color: var(--muted); padding: 26px; text-align: center; font-size: 14px; }
.esqueleto { height: 14px; border-radius: 4px; background: linear-gradient(90deg, var(--surface-3), var(--surface-2), var(--surface-3)); background-size: 200% 100%;
  animation: brilho 1.2s infinite linear; }
@keyframes brilho { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.lista-simples .item { grid-template-columns: minmax(0, 1fr) auto; }
.cli-item { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 90px 120px 120px; }
.peca-item { grid-template-columns: minmax(0, 1.6fr) 110px 110px 110px 120px; }

/* ---------- ordem de serviço ---------- */
.os-topo { display: grid; gap: 14px; }
.os-id { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.os-num { font: 700 40px/0.95 var(--display); letter-spacing: .01em; }
.os-num span { color: var(--ember); font-family: var(--mono); font-weight: 500; font-size: 32px; }
.os-meta { display: flex; gap: 6px 16px; flex-wrap: wrap; color: var(--muted); font-size: 13.5px; }
.os-meta b { color: var(--ink); font-weight: 600; }
.os-quem { font-size: 16px; font-weight: 600; margin: -4px 0 0; }
.os-quem span { color: var(--muted); font-weight: 400; }
.passos { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.passo { display: grid; gap: 6px; font-size: 11.5px; color: var(--faint); font-weight: 500; min-width: 0; }
.passo i { display: block; height: 5px; border-radius: 3px; background: var(--surface-3); }
.passo.feito i { background: color-mix(in srgb, var(--ember) 55%, var(--surface-3)); }
.passo.atual i { background: var(--ember); }
.passo.atual { color: var(--ink); font-weight: 600; }
.passo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.os-acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.abas { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.abas::-webkit-scrollbar { display: none; }
.aba { text-decoration: none; background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap;
  border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 7px; align-items: center; font-size: 14.5px; }
.aba:hover { color: var(--ink); }
.aba[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ember); font-weight: 600; }
.aba .badge { height: 18px; min-width: 18px; font-size: 10.5px; }
.salvar-barra { position: sticky; bottom: 0; z-index: 20; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 10px 12px; box-shadow: var(--shadow-lg);
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.salvar-barra .estado { font-size: 13px; color: var(--muted); margin-right: auto; }
.salvar-barra .estado.sujo { color: var(--warn); font-weight: 600; }
.ro-aviso { font-size: 13px; color: var(--muted); }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 7px 6px;
  border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px; border-bottom: 1px solid var(--line-2); vertical-align: middle; font-size: 14px; }
td input, td select { padding: 7px 8px; min-height: 38px; }
td.num, th.num { text-align: right; white-space: nowrap; font-family: var(--mono); }
.itens td:nth-child(1) { min-width: 170px; }
.itens td:nth-child(2) { width: 70px; }
.itens td:nth-child(3), .itens td:nth-child(4) { width: 112px; }
.itens td input { min-width: 64px; }
.margens { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.margens button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 10px; cursor: pointer; font: 500 12px var(--mono); }
.margens button:hover { border-color: var(--ember); }
.estoque-tag { display: inline-flex; gap: 4px; align-items: center; font-size: 11.5px; color: var(--muted); }

.fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.foto { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
.foto img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
.foto button { position: absolute; top: 5px; right: 5px; border: 0; border-radius: 5px; background: rgba(0, 0, 0, .65); color: #fff; width: 26px; height: 26px;
  cursor: pointer; display: grid; place-items: center; }
.upload { display: inline-flex; align-items: center; gap: 8px; border: 1px dashed var(--muted); border-radius: var(--r); padding: 10px 14px; cursor: pointer;
  font-weight: 600; font-size: 14px; background: var(--surface); }
.upload:hover { border-color: var(--ember); }
.upload input { display: none; }
.etapa-fotos { display: grid; gap: 10px; }
.etapa-fotos + .etapa-fotos { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line-2); }
.hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }

.linha-tempo { display: grid; gap: 0; position: relative; }
.ev { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; padding: 8px 0; position: relative; }
.ev::before { content: ""; position: absolute; left: 16px; top: 38px; bottom: -8px; width: 2px; background: var(--line-2); }
.ev:last-child::before { display: none; }
.ev .dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--muted); z-index: 1; }
.ev .dot.cliente { background: var(--ok-soft); color: var(--ok); }
.ev .dot.status { background: var(--ember-soft); color: var(--ember); }
.ev p { margin: 0; font-size: 14px; }
.ev small { color: var(--faint); font-size: 12.5px; }

.orc { border: 1px solid var(--line-2); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; background: var(--surface); }
.orc.pendente { border-color: color-mix(in srgb, var(--warn) 45%, var(--line-2)); }
.orc.aprovado { border-color: color-mix(in srgb, var(--ok) 45%, var(--line-2)); }
.orc.recusado { border-color: color-mix(in srgb, var(--bad) 45%, var(--line-2)); }
.orc.substituido { opacity: .7; }

.resumo-cliente { display: grid; gap: 8px; padding: 12px 14px; border-radius: var(--r); background: var(--info-soft); color: var(--ink); font-size: 13.5px; }
.resumo-cliente b { color: var(--info); }

/* ---------- nova OS ---------- */
.etapas-nova { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.etapa-nova { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--line-2);
  background: var(--surface); cursor: pointer; text-align: left; color: var(--muted); font-weight: 500; }
.etapa-nova b { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); font: 600 13px/1 var(--mono); flex: none; }
.etapa-nova[aria-current="step"] { border-color: var(--ember); color: var(--ink); }
.etapa-nova[aria-current="step"] b { background: var(--ember); color: var(--ember-ink); }
.etapa-nova.feita b { background: var(--ok-soft); color: var(--ok); }
.sugestoes { display: grid; gap: 4px; margin-top: 6px; }
.sugestao { display: flex; justify-content: space-between; gap: 10px; padding: 9px 11px; border: 1px solid var(--line-2); border-radius: var(--r-sm);
  background: var(--surface); cursor: pointer; text-align: left; width: 100%; font-size: 14px; }
.sugestao:hover, .sugestao[aria-selected="true"] { border-color: var(--ember); background: var(--ember-soft); }
.sugestao small { color: var(--muted); }

/* ---------- busca global ---------- */
.busca-modal .modal-card { max-width: 640px; align-self: start; margin-top: 8vh; padding: 0; overflow: hidden; }
.busca-campo { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line-2); }
.busca-campo input { border: 0; padding: 6px 0; min-height: 40px; font-size: 16px; background: transparent; }
.busca-campo input:focus-visible { outline: none; }
.busca-res { max-height: min(60vh, 520px); overflow-y: auto; padding: 8px; display: grid; gap: 2px; }
.busca-res h4 { margin: 8px 8px 4px; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.res { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 8px;
  text-decoration: none; color: inherit; cursor: pointer; }
.res:hover, .res[aria-selected="true"] { background: var(--surface-3); }
.res small { display: block; color: var(--muted); font-size: 12.5px; }

/* ---------- modais e avisos ---------- */
.modal { position: fixed; inset: 0; background: rgba(10, 12, 16, .5); z-index: 60; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal-card { background: var(--surface); border-radius: var(--r-lg); padding: 20px; width: 100%; max-width: 480px; max-height: calc(100vh - 32px);
  overflow-y: auto; display: grid; gap: 14px; box-shadow: var(--shadow-lg); }
.modal-card.largo { max-width: 720px; }
.modal-card h3 { margin: 0; font: 600 21px/1.15 var(--display); letter-spacing: .03em; text-transform: uppercase; }
.modal-card p { margin: 0; }
.modal-acoes { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.zoom img { max-height: 80vh; border-radius: var(--r); margin: 0 auto; display: block; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg);
  padding: 11px 16px; border-radius: 9px; font-weight: 600; z-index: 90; max-width: calc(100% - 32px); box-shadow: var(--shadow-lg); font-size: 14px;
  animation: subir .18s ease-out; }
.toast.erro { background: var(--bad); color: #fff; }
@keyframes subir { from { transform: translate(-50%, 8px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.assinatura-canvas { width: 100%; height: 200px; border: 1px dashed var(--muted); border-radius: var(--r); background: #fff; touch-action: none; cursor: crosshair; }
.qr-box { display: grid; place-items: center; padding: 12px; background: #fff; border-radius: var(--r); }

/* ---------- telas de acesso ---------- */
.auth { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 24px 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.auth-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 18px; padding: 28px 24px;
  display: grid; gap: 14px; box-shadow: var(--shadow); }
.auth-marca { display: flex; align-items: center; gap: 12px; justify-content: center; }
.auth-marca img { width: 48px; height: 48px; border-radius: 10px; object-fit: contain; background: #fff; }
.auth-marca .mono-mark { width: 48px; height: 48px; border-radius: 10px; background: var(--ember); color: var(--ember-ink); display: grid; place-items: center; font: 700 24px/1 var(--display); }
.auth-marca b { font: 700 26px/1 var(--display); letter-spacing: .03em; text-transform: uppercase; }
.auth-card h1 { margin: 0; font-size: 18px; text-align: center; font-weight: 600; }
.auth-card .sub { text-align: center; margin: 0 auto; }

/* ---------- portal do cliente ---------- */
.portal { max-width: 720px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
.portal-cab { display: flex; align-items: center; gap: 12px; }
.portal-cab img { width: 52px; height: 52px; border-radius: 10px; object-fit: contain; background: #fff; border: 1px solid var(--line-2); }
.portal-cab b { font: 700 26px/1.05 var(--display); letter-spacing: .03em; text-transform: uppercase; display: block; }
.portal-status { padding: 18px; border-radius: var(--r-lg); background: var(--ember); color: var(--ember-ink); display: grid; gap: 4px; }
.portal-status small { opacity: .85; font-weight: 500; }
.portal-status b { font: 700 32px/1.05 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.portal-pe { text-align: center; font-size: 12px; color: var(--faint); padding-top: 8px; }

/* ---------- gráfico de barras ---------- */
.barras { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; align-items: end; height: 180px; padding-top: 6px; }
.barra { display: grid; grid-template-rows: 1fr auto; gap: 5px; height: 100%; text-align: center; font-size: 11.5px; color: var(--muted); min-width: 0; }
.barra .col { display: flex; align-items: flex-end; justify-content: center; gap: 3px; border-bottom: 1px solid var(--line); }
.barra .col i { display: block; width: 30%; max-width: 20px; border-radius: 3px 3px 0 0; background: var(--ember); min-height: 2px; }
.barra .col i.l { background: var(--ok); }
.barra .col i.r { background: var(--info); }
.barra.atual span { color: var(--ink); font-weight: 600; }
.legenda { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
.legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--ember); margin-right: 5px; vertical-align: -1px; }
.legenda i.l { background: var(--ok); }
.legenda i.r { background: var(--info); }
.rank { display: grid; gap: 8px; }
.rank-lin { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 13.5px; }
.rank-lin .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.rank-lin .bar i { display: block; height: 100%; background: var(--ember); border-radius: 3px; }

/* ---------- responsivo ---------- */
@media (max-width: 1180px) {
  .fluxo { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cols-main { grid-template-columns: minmax(0, 1fr); }
  .lista-cab, .item { grid-template-columns: 70px minmax(0, 1.4fr) minmax(0, 1.2fr) 160px 100px 104px; }
  .lista-cab .t, .item .t { display: none; }
}
@media (max-width: 1023px) {
  :root { --side-w: 72px; }
  .side { padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: 10px; }
  .side-brand { justify-content: center; padding: 4px 0 14px; }
  .side-brand > span, .nav a span, .side-user span, .nav a .badge, .side-nova span { display: none; }
  .nav a { justify-content: center; padding: 11px 0; position: relative; }
  .nav a .badge-dot { position: absolute; top: 6px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--ember); }
  .side-nova { padding: 0; width: 42px; justify-self: center; }
  .side-user { justify-content: center; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols, .cols-3 { grid-template-columns: minmax(0, 1fr); }
}
@media (min-width: 1024px) { .nav a .badge-dot { display: none; } }
@media (max-width: 760px) {
  .side { display: none; }
  .main { margin-left: 0; }
  .top-brand { display: flex; flex: 1; }
  .busca-btn { flex: none; width: 42px; padding: 0; justify-content: center; max-width: none; }
  .busca-btn span, .busca-btn kbd { display: none; }
  .top-acoes .esconde-cel { display: none; }
  .wrap { padding-block: 14px calc(96px + env(safe-area-inset-bottom, 0px)); }
  .bottom { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; inset: auto 0 0 0; z-index: 45;
    background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
  .bottom a, .bottom button { display: grid; justify-items: center; gap: 2px; padding: 5px 2px; font-size: 11px; font-weight: 500; color: var(--muted);
    text-decoration: none; background: none; border: 0; cursor: pointer; position: relative; }
  .bottom a[aria-current="page"] { color: var(--ink); }
  .bottom a[aria-current="page"] .ico { color: var(--ember); }
  .bottom .nova { align-self: center; }
  .bottom .nova .bolha { width: 48px; height: 48px; border-radius: 14px; background: var(--ember); color: var(--ember-ink); display: grid; place-items: center;
    margin-top: -18px; box-shadow: var(--shadow-lg); }
  .bottom .badge-dot { position: absolute; top: 3px; right: calc(50% - 16px); width: 8px; height: 8px; border-radius: 50%; background: var(--ember); }
  .h1 { font-size: 26px; }
  .g, .g.g2, .g.g4 { grid-template-columns: minmax(0, 1fr); }
  .g .span2 { grid-column: auto; }
  .fluxo { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi b { font-size: 21px; }
  .lista-cab { display: none; }
  .item { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "c v" "a s" "p p"; gap: 3px 10px; padding: 12px 14px; }
  .item .n { display: none; }
  .item .c { grid-area: c; }
  .item .c b::before { content: attr(data-n); font-family: var(--mono); color: var(--ember); font-weight: 500; margin-right: 6px; }
  .item .a { grid-area: a; color: var(--muted); font-size: 13px; }
  .item .s { grid-area: s; justify-self: end; }
  .item .v { grid-area: v; }
  .item .p { grid-area: p; font-size: 12.5px; color: var(--muted); }
  .item .p:empty { display: none; }
  .item .t { display: none; }
  .cli-item { grid-template-areas: "c v" "a s"; }
  .peca-item { grid-template-areas: "c v" "a s"; }
  .passos { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .passo span { display: none; }
  .passo.atual span { display: block; position: absolute; }
  .os-num { font-size: 34px; }
  .os-num span { font-size: 28px; }
  .etapas-nova .etapa-nova span { display: none; }
  .etapas-nova .etapa-nova[aria-current="step"] span { display: inline; }
  .modal { place-items: end center; padding-bottom: 0; }
  .modal-card { border-radius: 18px 18px 0 0; max-height: 92vh; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
  .busca-modal { place-items: start center; padding-top: max(10px, env(safe-area-inset-top, 0px)); }
  .busca-modal .modal-card { margin-top: 0; border-radius: 16px; }
  .salvar-barra { bottom: calc(66px + env(safe-area-inset-bottom, 0px)); padding-bottom: 10px; }
  .barras { gap: 4px; }
}
@media print { .side, .top, .bottom, .salvar-barra { display: none !important; } .main { margin: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

const hojeISO = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const somaDias = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
const dataBR = s => s ? String(s).slice(0, 10).split('-').reverse().join('/') : '—';
const dataHoraBR = s => s ? new Date(s).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const diasEntre = (a, b) => Math.round((new Date(String(b).slice(0, 10) + 'T12:00:00') - new Date(String(a).slice(0, 10) + 'T12:00:00')) / 86400000);
const nOS = n => n ? String(n).padStart(4, '0') : 'NOVA';
const soDigitos = s => String(s || '').replace(/\D/g, '');
const clone = o => JSON.parse(JSON.stringify(o));
const corValida = c => /^#[0-9a-fA-F]{6}$/.test(String(c || '')) ? c : '#d9531a';
const linkSeguro = u => /^https:\/\/[^\s"'<>]+$/i.test(String(u || '')) ? u : '';
const meta = n => (document.querySelector(`meta[name="${n}"]`) || {}).content || '';
const chaveUnica = p => (p || 'k') + '-' + Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join('');
const primeiroNome = s => String(s || '').trim().split(/\s+/)[0] || '';
const iniciais = s => String(s || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0] || '').join('').toUpperCase() || '?';
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const tempoRelativo = s => {
  if (!s) return '';
  const m = Math.round((Date.now() - new Date(s).getTime()) / 60000);
  if (m < 1) return 'agora';
  if (m < 60) return `há ${m} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `há ${h} h`;
  const d = Math.round(h / 24);
  if (d < 30) return `há ${d} dia${d > 1 ? 's' : ''}`;
  return dataBR(String(s).slice(0, 10));
};
// "há quanto tempo", em dias inteiros, a partir de uma data/hora
const diasDesde = s => s ? Math.floor((Date.now() - new Date(s).getTime()) / 86400000) : 0;

// Telefone brasileiro → formato do wa.me (55 + DDD + número). Vazio se incompleto.
function telWhats(tel) {
  let d = soDigitos(tel).replace(/^0+/, '');
  if (d.length === 10 || d.length === 11) return '55' + d;
  if ((d.length === 12 || d.length === 13) && d.startsWith('55')) return d;
  return '';
}
const linkWhats = (tel, texto) => { const t = telWhats(tel); return t ? `https://wa.me/${t}?text=${encodeURIComponent(texto || '')}` : ''; };

function toast(msg, erro) {
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (erro ? ' erro' : '');
  t.setAttribute('role', erro ? 'alert' : 'status');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), erro ? 5200 : 2600);
}

async function copiar(texto, aviso = 'Copiado') {
  try { await navigator.clipboard.writeText(texto); toast(aviso); return true; }
  catch {
    const ta = document.createElement('textarea'); ta.value = texto; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch { }
    ta.remove(); toast(ok ? aviso : 'Não deu para copiar neste aparelho. Selecione e copie manualmente.', !ok); return ok;
  }
}

function baixarArquivo(blob, nome) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
const blobParaData = blob => new Promise((ok, falha) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = falha; fr.readAsDataURL(blob); });

// texto seguro para as fontes padrão do PDF (WinAnsi): troca o que não existe nelas
function textoPDF(s) {
  return String(s ?? '').normalize('NFC')
    .replace(/[‘’‚]/g, "'").replace(/[“”„]/g, '"').replace(/[–—]/g, '-')
    .replace(/…/g, '...').replace(/[•●]/g, '·').replace(/→/g, '->').replace(/ /g, ' ')
    .replace(/[^\x09\x0A\x0D\x20-\x7E -ÿ€ŒœŠšŸŽž]/g, '');
}

// =====================================================================
//  Cliente Supabase mínimo (fetch, sem bibliotecas de terceiros)
//  Evolução do cliente da v1: + paginação com total, + chamada anônima, + URL pública.
// =====================================================================
const SB = (() => {
  const URL_BASE = meta('supabase-url').trim().replace(/\/+$/, '');
  const KEY = meta('supabase-key').trim();
  const LS = 'forja-os-sessao';
  let sessao = null, renovando = null;
  const ouvintes = [];

  const configurado = (/^https:\/\/[a-z0-9.-]+$/i.test(URL_BASE) || /^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?$/.test(URL_BASE))
    && KEY.length > 20 && !/COLE_AQUI/.test(KEY);

  const lerSalva = () => { try { return JSON.parse(localStorage.getItem(LS) || localStorage.getItem('os-sessao') || 'null'); } catch { return null; } };
  const salvar = s => { try { s ? localStorage.setItem(LS, JSON.stringify(s)) : localStorage.removeItem(LS); localStorage.removeItem('os-sessao'); } catch { } };
  function definir(s, evento) {
    if (s && !s.expires_at) s.expires_at = Math.floor(Date.now() / 1000) + (s.expires_in || 3600);
    sessao = s; salvar(s);
    ouvintes.forEach(f => { try { f(evento, s); } catch { } });
  }
  function erro(codigo, mensagem, status) { const e = new Error(mensagem); e.code = String(codigo || ''); e.status = status || 0; return e; }

  async function bruto(caminho, op = {}) {
    const h = { apikey: KEY, ...(op.headers || {}) };
    // token do usuário logado; sem login, só a chave legada "anon" (JWT) vai no Authorization.
    // A chave nova "publishable" vai apenas no cabeçalho apikey, como o Supabase pede.
    const tok = op.token || (op.anonimo ? '' : (op.auth !== false && sessao ? sessao.access_token : '')) || (KEY.startsWith('eyJ') ? KEY : '');
    if (tok) h.Authorization = 'Bearer ' + tok;
    let corpo = op.body;
    if (corpo !== undefined && !(corpo instanceof Blob)) { h['Content-Type'] = 'application/json'; corpo = JSON.stringify(corpo); }
    try { return await fetch(URL_BASE + caminho, { method: op.method || 'GET', headers: h, body: corpo, cache: 'no-store' }); }
    catch { throw erro('rede', 'Sem conexão com a internet. Verifique o sinal e tente de novo.'); }
  }

  async function tokenValido() {
    if (!sessao) return;
    if (sessao.expires_at - Math.floor(Date.now() / 1000) > 90) return;
    await renovar();
  }
  function renovar() {
    if (renovando) return renovando;
    renovando = (async () => {
      try {
        const r = await bruto('/auth/v1/token?grant_type=refresh_token', { method: 'POST', auth: false, anonimo: true, body: { refresh_token: sessao.refresh_token } });
        if (r.ok) { definir(await r.json(), 'TOKEN_REFRESHED'); return; }
        if (r.status >= 400 && r.status < 500) { definir(null, 'SIGNED_OUT'); throw erro('sessao', 'Sua sessão expirou. Entre de novo.', 401); }
        throw erro('rede', 'Não foi possível renovar a sessão.');
      } finally { renovando = null; }
    })();
    return renovando;
  }

  async function req(caminho, op = {}) {
    if (op.auth !== false && !op.anonimo) await tokenValido();
    let r = await bruto(caminho, op);
    if (r.status === 401 && op.auth !== false && !op.anonimo && sessao) { await renovar(); r = await bruto(caminho, op); }
    if (!r.ok) {
      let j = {}; try { j = await r.json(); } catch { }
      throw erro(j.code || j.error_code || j.error || r.status, j.message || j.msg || j.error_description || j.error || ('Erro ' + r.status), r.status);
    }
    if (op.raw) return r;
    if (r.status === 204) return null;
    const t = await r.text();
    return t ? JSON.parse(t) : null;
  }

  const q = obj => Object.entries(obj).filter(([, v]) => v !== undefined && v !== null && v !== '')
    .map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');
  const caminhoArq = p => p.split('/').map(encodeURIComponent).join('/');

  return {
    configurado,
    get sessao() { return sessao; },
    get uid() { return sessao && sessao.user ? sessao.user.id : null; },
    get email() { return sessao && sessao.user ? sessao.user.email : ''; },
    aoMudar(f) { ouvintes.push(f); },

    // ----- login -----
    async iniciar() {
      // volta de link do e-mail (confirmação ou nova senha): #access_token=...
      const h = new URLSearchParams(location.hash.slice(1));
      if (h.get('error_description')) {
        history.replaceState(null, '', location.pathname + location.search);
        throw erro('link', h.get('error_description').replace(/\+/g, ' '));
      }
      if (h.get('access_token')) {
        const token = h.get('access_token');
        history.replaceState(null, '', location.pathname + location.search);
        const user = await req('/auth/v1/user', { token });
        definir({ access_token: token, refresh_token: h.get('refresh_token'), expires_in: +h.get('expires_in') || 3600, user },
          h.get('type') === 'recovery' ? 'PASSWORD_RECOVERY' : 'SIGNED_IN');
        return h.get('type');
      }
      const s = lerSalva();
      if (s && s.refresh_token && s.user) {
        sessao = s;
        try { await tokenValido(); } catch (e) { if (e.code === 'sessao') return; }
      }
    },
    async entrar(email, senha) {
      definir(await req('/auth/v1/token?grant_type=password', { method: 'POST', auth: false, anonimo: true, body: { email, password: senha } }), 'SIGNED_IN');
    },
    async cadastrar(email, senha, dados, destino) {
      const r = await req('/auth/v1/signup?' + q({ redirect_to: destino || (location.origin + location.pathname) }),
        { method: 'POST', auth: false, anonimo: true, body: { email, password: senha, data: dados || {} } });
      if (r && r.access_token) { definir(r, 'SIGNED_IN'); return true; }
      return false;   // precisa confirmar o e-mail
    },
    async recuperar(email) {
      await req('/auth/v1/recover?' + q({ redirect_to: location.origin + location.pathname }), { method: 'POST', auth: false, anonimo: true, body: { email } });
    },
    async novaSenha(senha) { await req('/auth/v1/user', { method: 'PUT', body: { password: senha } }); },
    async sair() {
      try { if (sessao) await bruto('/auth/v1/logout?scope=local', { method: 'POST' }); } catch { }
      definir(null, 'SIGNED_OUT');
    },

    // ----- banco -----
    async select(tabela, filtros, lote = 1000) {
      const todos = [];
      for (let de = 0; ; de += lote) {
        const r = await req(`/rest/v1/${tabela}?${q(filtros)}`, { headers: { 'Range-Unit': 'items', Range: `${de}-${de + lote - 1}` } });
        todos.push(...(r || []));
        if (!r || r.length < lote || filtros.limit) return todos;
      }
    },
    async pagina(tabela, filtros, de, ate) {
      const r = await req(`/rest/v1/${tabela}?${q(filtros)}`, { raw: true, headers: { 'Range-Unit': 'items', Range: `${de}-${ate}`, Prefer: 'count=exact' } });
      const linhas = r.status === 204 ? [] : await r.json();
      const cr = r.headers.get('Content-Range') || '';
      const total = +(cr.split('/')[1] || linhas.length) || 0;
      return { linhas, total };
    },
    async insert(tabela, linhas) {
      return req(`/rest/v1/${tabela}`, { method: 'POST', body: linhas, headers: { Prefer: 'return=representation' } });
    },
    async update(tabela, filtros, dados) {
      const r = await req(`/rest/v1/${tabela}?${q(filtros)}`, { method: 'PATCH', body: dados, headers: { Prefer: 'return=representation' } });
      if (!r || !r.length) throw erro('42501', 'Sem permissão para alterar este registro.', 403);
      return r[0];
    },
    async remove(tabela, filtros) {
      const r = await req(`/rest/v1/${tabela}?${q(filtros)}`, { method: 'DELETE', headers: { Prefer: 'return=representation' } });
      if (!r || !r.length) throw erro('42501', 'Sem permissão para excluir este registro.', 403);
    },
    rpc(fn, args = {}) { return req(`/rest/v1/rpc/${fn}`, { method: 'POST', body: args }); },
    rpcAnonimo(fn, args = {}) { return req(`/rest/v1/rpc/${fn}`, { method: 'POST', body: args, anonimo: true, auth: false }); },

    // ----- arquivos -----
    async enviar(bucket, caminho, blob) {
      await req(`/storage/v1/object/${bucket}/${caminhoArq(caminho)}`, { method: 'POST', body: blob, headers: { 'Content-Type': blob.type, 'x-upsert': 'false', 'cache-control': '3600' } });
    },
    async baixar(bucket, caminho) {
      const r = await req(`/storage/v1/object/authenticated/${bucket}/${caminhoArq(caminho)}`, { raw: true });
      return r.blob();
    },
    urlPublica(bucket, caminho) { return caminho ? `${URL_BASE}/storage/v1/object/public/${bucket}/${caminhoArq(caminho)}` : ''; },
    async apagar(bucket, caminhos) {
      if (!caminhos.length) return;
      await req(`/storage/v1/object/${bucket}`, { method: 'DELETE', body: { prefixes: caminhos } });
    }
  };
})();

// Mensagens do banco escritas em português (regras de negócio) passam direto;
// mensagens técnicas do Postgres viram um texto claro para quem usa.
function msgErro(e) {
  const c = String((e && e.code) || ''), m = String((e && e.message) || '');
  const tecnica = /violates|permission denied|invalid input|duplicate key|syntax|null value|does not exist|relation|column|function|operator|JWT|PGRST/i.test(m);
  if (c === 'rede' || c === 'sessao' || c === 'link') return m;
  if (/invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/email not confirmed/i.test(m)) return 'Confirme seu e-mail antes de entrar (veja a caixa de entrada e o spam).';
  if (/already registered|already been registered|user_already_exists/i.test(m + c)) return 'Este e-mail já tem conta. Use "Entrar" ou "Esqueci a senha".';
  if (/rate limit|too many/i.test(m)) return 'Muitas tentativas. Espere alguns minutos e tente de novo.';
  if (/password/i.test(m) && /least|short|weak|characters/i.test(m)) return 'Senha fraca. Use pelo menos 8 caracteres, com letras e números.';
  if (/payload too large|exceeded the maximum/i.test(m)) return 'Arquivo grande demais.';
  if (/mime type/i.test(m)) return 'Formato de arquivo não aceito.';
  if (!tecnica && m && m.length < 200 && /[a-zà-ú]/i.test(m) && !/^Erro \d+$/.test(m)) return m;
  if (c === '42501' || /row-level security|permission denied/i.test(m)) return 'Sem permissão para isso. Se a assinatura venceu, o sistema fica só para consulta.';
  if (c === '23505') return 'Esse registro já existe.';
  if (c === '23514' || c === '22023' || c === '22P02' || c === '23502') return 'Algum campo tem um valor inválido. Confira e tente de novo.';
  return 'Algo deu errado. Tente de novo.';
}

    garantia: o.garantia_ate ? dataBR(o.garantia_ate) : (o.garantia ? `${o.garantia} dias após a entrega` : '—')
  };
  return String(texto || '').replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m)).replace(/\n{3,}/g, '\n\n').trim();
}

// =====================================================================
//  Componentes de tela: modal, confirmação, menu, campos, imagens, QR
// =====================================================================
const pilhaModais = [];

function modal({ titulo = '', corpo = '', acoes = [], largo = false, classe = '', aoAbrir, aoFechar, form = true } = {}) {
  const m = document.createElement('div');
  m.className = 'modal ' + classe;
  const tag = form ? 'form' : 'div';
  m.innerHTML = `<${tag} class="modal-card ${largo ? 'largo' : ''}" role="dialog" aria-modal="true" ${titulo ? 'aria-labelledby="mtit"' : ''} ${form ? 'novalidate' : ''}>
    ${titulo ? `<div class="between"><h3 id="mtit">${titulo}</h3><button type="button" class="btn ghost icon sm" data-fechar aria-label="Fechar">${ico('x')}</button></div>` : ''}
    <div class="modal-corpo" style="display:grid;gap:14px">${corpo}</div>
    <p class="erro-txt" role="alert" hidden></p>
    ${acoes.length ? `<div class="modal-acoes">${acoes.map((a, i) => `<button type="${a.submit ? 'submit' : 'button'}" class="btn ${a.tipo || ''}" data-acao="${i}">${a.texto}</button>`).join('')}</div>` : ''}
  </${tag}>`;
  document.body.appendChild(m);
  const card = m.firstElementChild;
  const erroEl = card.querySelector('.erro-txt');
  const ctrl = {
    el: card,
    fechar() { if (!m.isConnected) return; m.remove(); pilhaModais.splice(pilhaModais.indexOf(ctrl), 1); if (aoFechar) aoFechar(); },
    erro(t) { erroEl.textContent = t || ''; erroEl.hidden = !t; },
    $: s => card.querySelector(s), $$: s => [...card.querySelectorAll(s)]
  };
  pilhaModais.push(ctrl);
  const rodar = async (a, bt) => {
    if (!a) return;
    if (!a.acao) { ctrl.fechar(); return; }
    ctrl.erro('');
    bt.disabled = true;
    try { const r = await a.acao(ctrl); if (r !== false) ctrl.fechar(); }
    catch (e) { ctrl.erro(msgErro(e)); }
    finally { if (bt.isConnected) bt.disabled = false; }
  };
  m.addEventListener('mousedown', e => { if (e.target === m) m.dataset.fora = '1'; });
  m.addEventListener('click', e => {
    if (e.target === m && m.dataset.fora === '1') { ctrl.fechar(); return; }
    m.dataset.fora = '';
    if (e.target.closest('[data-fechar]')) { ctrl.fechar(); return; }
    const b = e.target.closest('[data-acao]');
    if (b && b.type !== 'submit') rodar(acoes[+b.dataset.acao], b);
  });
  if (form) card.addEventListener('submit', e => {
    e.preventDefault();
    const i = acoes.findIndex(a => a.submit);
    if (i >= 0) rodar(acoes[i], card.querySelector(`[data-acao="${i}"]`));
  });
  // foco inicial só se a pessoa ainda não clicou/digitou em outro campo do modal
  setTimeout(() => { if (card.contains(document.activeElement)) return; const f = card.querySelector('[autofocus], input:not([type=hidden]):not([type=checkbox]):not([type=radio]), select, textarea'); if (f) f.focus(); }, 30);
  if (aoAbrir) aoAbrir(ctrl);
  return ctrl;
}

function confirmar(msg, { titulo = 'Confirmar', ok = 'Confirmar', perigo = false, cancelar = 'Cancelar' } = {}) {
  return new Promise(res => {
    let decidido = false;
    modal({
      titulo, corpo: `<p>${msg}</p>`, form: false,
      acoes: [{ texto: cancelar, acao: () => { decidido = true; res(false); } },
              { texto: ok, tipo: perigo ? 'del armado' : 'pri', acao: () => { decidido = true; res(true); } }],
      aoFechar: () => { if (!decidido) res(false); }
    });
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (fecharMenu()) return;
    const m = pilhaModais[pilhaModais.length - 1]; if (m) m.fechar();
  }
});

function fecharMenu() { if (menuAberto) { menuAberto.remove(); menuAberto = null; return true; } return false; }

const campo = (id, rot, valor, attrs = '') => `<div class="f"><label for="${id}">${rot}</label><input id="${id}" name="${id}" value="${esc(valor ?? '')}" ${attrs}></div>`;
const area = (id, rot, valor, attrs = '') => `<div class="f"><label for="${id}">${rot}</label><textarea id="${id}" name="${id}" ${attrs}>${esc(valor ?? '')}</textarea></div>`;

// ---------- imagens ----------
function comprimir(arquivo, lado = 1200, limite = 220000, tipo = 'image/jpeg') {
  return new Promise((ok, falha) => {
    const img = new Image(), url = URL.createObjectURL(arquivo);
    img.onload = async () => {
      URL.revokeObjectURL(url);
      try {
        let q = 0.8, w, h, blob, c;
        do {
          const k = Math.min(1, lado / Math.max(img.width, img.height));
          w = Math.max(1, Math.round(img.width * k)); h = Math.max(1, Math.round(img.height * k));
          c = document.createElement('canvas'); c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          if (tipo === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
          ctx.drawImage(img, 0, 0, w, h);
          blob = await new Promise(r => c.toBlob(r, tipo, q));
          if (q > 0.55) q -= 0.1; else lado = Math.round(lado * 0.8);
        } while (blob && blob.size > limite && lado > 240);
        blob ? ok({ blob, w, h }) : falha(new Error('imagem'));
      } catch (e) { falha(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); falha(new Error('imagem')); };
    img.src = url;
  });
}
function ampliarFoto(src, legenda = '') {
  modal({ form: false, largo: true, classe: 'zoom', corpo: `<img src="${esc(src)}" alt="${esc(legenda || 'Foto ampliada')}">${legenda ? `<p class="hint">${esc(legenda)}</p>` : ''}`, acoes: [{ texto: 'Fechar' }] });
}

// ---------- QR code ----------
function qrMatriz(texto) {
  if (typeof qrcode !== 'function') return null;
  const q = qrcode(0, 'M'); q.addData(texto); q.make();
  const n = q.getModuleCount(), m = [];
  for (let r = 0; r < n; r++) { m.push([]); for (let c = 0; c < n; c++) m[r].push(q.isDark(r, c)); }
  return m;
}
function qrSVG(texto, px = 180) {
  const m = qrMatriz(texto); if (!m) return '';
  const n = m.length, borda = 2, t = n + borda * 2;
  let d = '';
  m.forEach((lin, r) => lin.forEach((v, c) => { if (v) d += `M${c + borda} ${r + borda}h1v1h-1z`; }));
  return `<svg viewBox="0 0 ${t} ${t}" width="${px}" height="${px}" role="img" aria-label="QR code do link" shape-rendering="crispEdges"><rect width="${t}" height="${t}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

// ---------- marca da assistência ----------
function aplicarMarca(m) {
  const cor = corValida(m && m.cor);
  const raiz = document.documentElement.style;
  raiz.setProperty('--ember', cor);
  const [r, g, b] = [1, 3, 5].map(i => parseInt(cor.slice(i, i + 2), 16));
  raiz.setProperty('--ember-ink', (r * 299 + g * 587 + b * 114) / 1000 > 165 ? '#111111' : '#ffffff');
  const tc = $('meta[name="theme-color"]'); if (tc) tc.content = cor;
}
const marcaSalva = () => { try { return JSON.parse(localStorage.getItem('forja-marca') || 'null'); } catch { return null; } };
function guardarMarca() {
  if (!S.empresa) return;

  const logo = S.empresa.logo_path ? API.urlLogo(S.empresa.logo_path) : '';

}

function telaAuth(modo = 'entrar', aviso = '', convite = null) {
  const m = marcaSalva() || {};
  aplicarMarca(m);
  document.title = m.nome ? `${m.nome} · Ordens de Serviço` : 'Ordens de Serviço';
  const titulo = { entrar: 'Entrar', criar: convite ? 'Criar sua conta' : 'Criar a conta da sua assistência', recuperar: 'Recuperar a senha', nova: 'Escolha uma nova senha' }[modo];
  raiz().innerHTML = `<main class="auth"><form class="auth-card" id="form-auth" novalidate>
    ${convite ? `<div class="resumo-cliente"><span>${ico('equipe', 'sm')} Convite para a equipe da <b>${esc(convite.empresa)}</b> como <b>${esc(PAPEIS[convite.papel] || convite.papel)}</b>.</span>
      <span class="muted">Use o e-mail que recebeu o convite (${esc(convite.email)}).</span></div>` : marcaHTML(m.nome, m.logo)}
    <h1>${titulo}</h1>
    ${aviso ? `<p class="banner info" style="margin:0">${esc(aviso)}</p>` : ''}
    ${modo === 'criar' ? campo('a-nome', 'Seu nome', '', 'maxlength="80" autocomplete="name" required') : ''}
    ${modo === 'criar' && !convite ? campo('a-oficina', 'Nome da assistência', '', 'maxlength="60" autocomplete="organization" placeholder="Ex.: CellMix" required') : ''}
    ${modo !== 'nova' ? campo('a-email', 'E-mail', '', 'type="email" autocomplete="email" inputmode="email" required') : ''}
    ${modo !== 'recuperar' ? campo('a-senha', modo === 'nova' ? 'Nova senha' : 'Senha', '', `type="password" minlength="8" required autocomplete="${modo === 'entrar' ? 'current-password' : 'new-password'}"`) : ''}
    ${modo === 'criar' || modo === 'nova' ? '<p class="hint" style="margin:-6px 0 0">Mínimo de 8 caracteres, com letras e números.</p>' : ''}
    <p class="erro-txt" id="a-erro" role="alert"></p>
    <button class="btn pri full" type="submit" id="a-ok">${{ entrar: 'Entrar', criar: 'Criar conta', recuperar: 'Enviar link por e-mail', nova: 'Salvar nova senha' }[modo]}</button>
    <div class="between">
      ${modo === 'entrar' ? `<button class="link" type="button" data-auth="criar">Criar conta</button><button class="link" type="button" data-auth="recuperar">Esqueci a senha</button>`
      : modo === 'nova' ? '' : `<button class="link" type="button" data-auth="entrar">${ico('esq', 'sm')} Voltar para entrar</button>`}
    </div>
    ${modo === 'criar' && !convite ? '<p class="hint" style="text-align:center">Ao criar a conta você concorda com os termos de uso do sistema e com o tratamento dos dados conforme a LGPD.</p>' : ''}
  </form></main>`;

  $('#form-auth').addEventListener('submit', async e => {
    e.preventDefault();
    const err = $('#a-erro'), bt = $('#a-ok');
    const val = id => ($('#' + id) || {}).value || '';
    const email = val('a-email').trim().toLowerCase(), senha = val('a-senha'), nome = val('a-nome').trim(), oficina = val('a-oficina').trim();
    err.textContent = '';
    if (modo !== 'nova' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'Digite um e-mail válido.'; return; }
    if ((modo === 'criar' || modo === 'nova') && (senha.length < 8 || !/[a-zA-Z]/.test(senha) || !/\d/.test(senha))) {
      err.textContent = 'A senha precisa de pelo menos 8 caracteres, com letras e números.'; return;
    }
    if (modo === 'criar' && !nome) { err.textContent = 'Digite seu nome.'; return; }
    if (modo === 'criar' && !convite && !oficina) { err.textContent = 'Digite o nome da assistência.'; return; }
    if (modo === 'entrar' && !senha) { err.textContent = 'Digite a senha.'; return; }
    bt.disabled = true;
    try {
      if (modo === 'entrar') { await SB.entrar(email, senha); await abrirSistema(); }
      else if (modo === 'criar') {
        if (!convite) try { localStorage.setItem('forja-marca', JSON.stringify({ nome: oficina, cor: '#d9531a' })); } catch { }
        const logado = await SB.cadastrar(email, senha, convite ? { nome } : { nome, oficina });
        if (logado) await abrirSistema();

    const pend = conviteGuardado.get();
    if (pend) { try { const e = await API.aceitarConvite(pend); empresaPreferida = e; toast('Convite aceito'); } catch (e) { toast(msgErro(e), true); } conviteGuardado.set(''); }
    let pref = empresaPreferida; if (!pref) { try { pref = localStorage.getItem('forja-empresa') || null; } catch { } }
    S.ini = await API.iniciar(pref);
    if (!S.ini.empresa_id) return telaOnboarding();
    try { localStorage.setItem('forja-empresa', S.ini.empresa_id); } catch { }
    const [emp, membros, modelos, abertas] = await Promise.all([
      API.empresa(S.ini.empresa_id), API.membros(S.ini.empresa_id), API.modelos(S.ini.empresa_id), API.ordensAbertas(S.ini.empresa_id)]);
    S.empresa = emp; S.membros = membros; S.modelos = modelos; S.abertas = abertas; S.pecas = null;

  } catch (e) {
    if (e.code === 'sessao') return telaAuth('entrar', 'Sua sessão expirou. Entre de novo.');
    raiz().innerHTML = `<main class="auth"><div class="auth-card"><h1>Não foi possível abrir o sistema</h1>
      <p class="sub">${esc(msgErro(e))}</p><button class="btn pri" id="tentar">Tentar de novo</button>

    $('#tentar').onclick = () => abrirSistema(empresaPreferida);

  }
  aplicarMarca(S.empresa); guardarMarca();

// aviso de assinatura (teste, vencendo, vencida, só consulta)
function pintarAviso() {
  const el = $('#aviso'); if (!el) return;
  const i = S.ini, a = i.assinatura || i.assinatura_resumo || {};
  const podeVer = pode('assinatura.ver');
  const pagar = podeVer ? (linkSeguro(a.link_pagamento) || linkSeguro(i.link_pagamento_padrao)) : '';
  const sup = telWhats(i.whatsapp_suporte);
  const supLink = podeVer && sup ? `https://wa.me/${sup}?text=${encodeURIComponent(`Olá! Sou da ${S.empresa.nome} (${SB.email}) e quero falar sobre a assinatura.`)}` : '';
  const bts = (pagar ? `<a class="btn pri sm" href="${esc(pagar)}" target="_blank" rel="noopener noreferrer">Pagar assinatura</a>` : '') +
              (supLink ? `<a class="btn sm" href="${esc(supLink)}" target="_blank" rel="noopener noreferrer">Falar com o suporte</a>` : '');
  const dias = a.vence_em ? diasEntre(i.hoje, a.vence_em) : null;
  let cls = '', txt = '';
  if (i.admin_plataforma && i.acesso_ativo && !a.vence_em) { el.innerHTML = ''; return; }
  if (!i.acesso_ativo) {
    cls = 'bad';
    txt = a.status === 'pendente' && !a.vence_em ? 'O acesso está aguardando liberação. Você já pode ver o sistema, mas ainda não pode criar ordens.'
      : podeVer ? 'Assinatura vencida: o sistema está só para consulta. Seus dados estão guardados e voltam a ser editáveis assim que o pagamento for confirmado.'
      : 'O sistema está só para consulta porque a assinatura venceu. Avise o responsável pela assistência.';
  } else if (dias !== null && dias < 0) {
    cls = 'bad'; const lim = somaDias(a.vence_em, i.carencia_dias || 0);
    txt = podeVer ? `Assinatura vencida há ${-dias} dia${-dias > 1 ? 's' : ''}. Regularize até ${dataBR(lim)} para não ficar só no modo consulta.` : '';
  } else if (a.status === 'teste' && dias !== null) {
    cls = 'info'; txt = podeVer ? (dias === 0 ? 'O período de teste termina hoje.' : `Período de teste: faltam ${dias} dia${dias > 1 ? 's' : ''}.`) : '';
  } else if (a.status === 'cancelada' && dias !== null) {
    txt = podeVer ? `Assinatura cancelada. O acesso continua até ${dataBR(a.vence_em)}.` : '';
  } else if (dias !== null && dias <= 5 && podeVer) {
    txt = dias === 0 ? 'A assinatura vence hoje.' : `A assinatura vence em ${dias} dia${dias > 1 ? 's' : ''} (${dataBR(a.vence_em)}).`;
  }
  el.innerHTML = txt ? `<div class="banner ${cls}"><span>${esc(txt)}</span>${bts}</div>` : '';
}

// ---------- rotas ----------
function lerRota() {
  const h = location.hash.replace(/^#\/?/, '');
  const [cam, qs] = h.split('?');
  const p = (cam || 'painel').split('/');
  let nome = p[0] || 'painel', id = p[1] || '';
  if (nome === 'ordens' && id === 'nova') { nome = 'nova'; id = ''; }
  return { nome, id, q: new URLSearchParams(qs || '') };
}
const TELAS = {};
async function rotear() {
  const r = lerRota();
  if (r.nome === 'acompanhar') return telaPortal(r.id);
  if (r.nome === 'convite') return telaConvite(r.id);
  if (!SB.sessao) return telaAuth();
  if (!S.ini || !$('#app')) return abrirSistema();
  if (S.sujo && S.salvarPendente) { try { await S.salvarPendente(true); } catch { } }
  S.sujo = false; S.salvarPendente = null;
  S.rota = r;
  marcarNav(); fecharMenu();
  const fn = TELAS[r.nome] || TELAS.painel;
  // cada tela recebe um contêiner novo: os ouvintes da tela anterior não sobrevivem
  const antigo = $('#app'), app = antigo.cloneNode(false);
  antigo.replaceWith(app);
  app.innerHTML = carregando();
  window.scrollTo({ top: 0 });
  try { await fn(app, r); }
  catch (e) {
    app.innerHTML = `<div class="card">${vazio('alerta', 'Não foi possível abrir esta tela', esc(msgErro(e)), '<button class="btn" type="button" id="tela-tentar">Tentar de novo</button>')}</div>`;
    const b = $('#tela-tentar', app); if (b) b.onclick = rotear;
  }
}
window.addEventListener('hashchange', rotear);
window.addEventListener('beforeunload', e => { if (S.sujo) { e.preventDefault(); e.returnValue = ''; } });

// ---------- busca global ----------
function abrirBusca() {
  if (!S.ini || !empId()) return;
  let sel = -1, resultados = [];
  const m = modal({ form: false, classe: 'busca-modal', corpo: `
    <div class="busca-campo">${ico('busca')}<input id="bq" type="search" placeholder="Nº da OS, nome, telefone, modelo ou IMEI" autocomplete="off" aria-label="Buscar"><button type="button" class="btn ghost sm" data-fechar>Fechar</button></div>
    <div class="busca-res" id="bres" role="listbox"></div>` });
  const corpo = m.$('.modal-corpo'); corpo.style.gap = '0';
  const res = m.$('#bres'), inp = m.$('#bq');
  const pintarAtalhos = () => {
    res.innerHTML = `<h4>Atalhos</h4>
      ${escreve('ordens.editar') ? `<a class="res" href="#/ordens/nova">${ico('mais')}<span>Nova ordem de serviço</span></a>` : ''}
      <a class="res" href="#/ordens?f=atrasadas">${ico('relogio')}<span>Ordens atrasadas</span><b class="num">${S.abertas.filter(atrasada).length}</b></a>
      <a class="res" href="#/ordens?f=Pronto">${ico('check')}<span>Prontas para retirada</span><b class="num">${S.abertas.filter(o => o.status === 'Pronto').length}</b></a>
      <a class="res" href="#/clientes">${ico('clientes')}<span>Todos os clientes</span></a>`;
    resultados = $$('.res', res);
  };
  const buscar = debounce(async q => {
    if (q.trim().length < 2 && !/^\d+$/.test(q.trim())) { pintarAtalhos(); return; }
    res.innerHTML = carregando('Buscando…');
    try {
      const r = await API.buscar(empId(), q);
      if (inp.value !== q) return;
      res.innerHTML = (r.ordens.length ? `<h4>Ordens</h4>` + r.ordens.map(o => `<a class="res" href="#/ordem/${esc(o.id)}"><span class="num" style="color:var(--ember)">#${nOS(o.numero)}</span>
          <span><b>${esc(o.cliente_nome || 'Sem nome')}</b><small>${esc([o.marca, o.modelo].filter(Boolean).join(' ') || '—')} · ${dataBR(o.data_entrada)}</small></span>${pillStatus(o.status)}</a>`).join('') : '') +
        (r.clientes.length ? `<h4>Clientes</h4>` + r.clientes.map(c => `<a class="res" href="#/cliente/${esc(c.id)}">${ico('usuario')}
          <span><b>${esc(c.nome || 'Sem nome')}</b><small>${esc(c.telefone || 'sem telefone')}</small></span><small class="muted">${c.ordens} OS</small></a>`).join('') : '') ||
        vazio('busca', 'Nada encontrado', 'Tente o número da OS, parte do nome, o telefone ou o IMEI.');
      resultados = $$('.res', res); sel = -1;
    } catch (e) { res.innerHTML = vazio('alerta', 'Não foi possível buscar', esc(msgErro(e))); }
  }, 250);
  inp.addEventListener('input', () => buscar(inp.value));
  inp.addEventListener('keydown', e => {
    if (!resultados.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + resultados.length) % resultados.length;
      resultados.forEach((r, i) => r.setAttribute('aria-selected', String(i === sel))); resultados[sel].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') { e.preventDefault(); (resultados[Math.max(0, sel)]).click(); }
  });
  res.addEventListener('click', e => { if (e.target.closest('a')) m.fechar(); });
  pintarAtalhos();
}
document.addEventListener('keydown', e => {
  const alvo = e.target, digitando = /INPUT|TEXTAREA|SELECT/.test(alvo.tagName) || alvo.isContentEditable;
  if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !digitando && !pilhaModais.length)) { e.preventDefault(); abrirBusca(); }
});

function descreverEvento(ev) {
  const d = ev.dados || {};
  const lista = a => (a || []).filter(Boolean).join(', ');
  switch (ev.tipo) {
    case 'ordem.aberta': return 'Ordem aberta';
    case 'ordem.status': return d.reaberta ? `Reaberta: ${rotulo(d.de)} → ${rotulo(d.para)}` : `Status: ${rotulo(d.para)}`;
    case 'ordem.valores': return `Valor alterado de ${brl(d.de)} para ${brl(d.para)}`;
    case 'ordem.diagnostico': return 'Diagnóstico registrado';
    case 'ordem.pecas': return [d.adicionadas && d.adicionadas.length ? `Peças incluídas: ${lista(d.adicionadas)}` : '', d.removidas && d.removidas.length ? `Peças removidas: ${lista(d.removidas)}` : ''].filter(Boolean).join(' · ') || 'Peças alteradas';
    case 'ordem.tecnico': return d.tecnico_id ? `Técnico responsável: ${nomeMembro(d.tecnico_id) || 'membro da equipe'}` : 'Técnico responsável removido';
    case 'ordem.garantia': return `Avaliação de garantia: ${{ em_avaliacao: 'em avaliação', coberto: 'coberto pela garantia', nao_coberto: 'não coberto' }[d.decisao] || d.decisao}`;
    case 'ordem.retorno': return `Retorno de garantia da OS nº ${nOS(d.origem)}`;
    case 'ordem.assinatura': return `Cliente assinou a ordem${d.nome ? ` (${d.nome})` : ''}`;
    case 'ordem.excluida': return `OS nº ${nOS(d.numero)} excluída`;
    case 'orcamento.publicado': return `Orçamento v${d.versao} enviado: ${brl(d.total)}`;
    case 'orcamento.aprovado': return `Orçamento v${d.versao} aprovado${d.nome ? ` por ${d.nome}` : ''} (${d.canal === 'portal' ? 'pelo link' : 'no balcão'})`;
    case 'orcamento.recusado': return `Orçamento v${d.versao} recusado${d.nome ? ` por ${d.nome}` : ''} (${d.canal === 'portal' ? 'pelo link' : 'no balcão'})`;
    case 'pagamento.sinal': return `Sinal recebido: ${brl(d.valor)} (${d.forma})`;
    case 'pagamento.pagamento': return `Pagamento recebido: ${brl(d.valor)} (${d.forma})`;
    case 'pagamento.estorno': return `Estorno: ${brl(d.valor)} (${d.forma})`;
    case 'portal.link': return 'Link de acompanhamento criado';
    case 'portal.revogado': return 'Link de acompanhamento desativado';
    default: return ev.tipo;
  }
}

            <span><p><b class="num" style="color:var(--ember)">#${nOS(ev.numero)}</b> ${esc(primeiroNome(ev.cliente_nome))} · ${esc(descreverEvento(ev))}</p><small>${esc(autorEvento(ev))} · ${tempoRelativo(ev.criado_em)}</small></span></a>`).join('')
