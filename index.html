async function telaPortal(token) {
  document.title = 'Acompanhamento do conserto';
  raiz().innerHTML = `<main class="portal">${carregando('Carregando o andamento do seu conserto…')}</main>`;
  let d = null;
  try { d = await API.portal(token); } catch (e) { d = { erro: msgErro(e) }; }
  if (!d || d.erro) {
    raiz().innerHTML = `<main class="portal"><div class="card">${vazio('link', d && d.erro ? 'Não foi possível abrir agora' : 'Link inválido ou vencido', d && d.erro ? esc(d.erro) : 'Peça um novo link para a assistência técnica.')}</div>
      <p class="portal-pe">Feito por FORJA OS</p></main>`;
    return;
  }
  const a = d.assistencia, o = d.ordem, b = d.orcamento;
  aplicarMarca({ cor: a.cor });
  document.title = `OS nº ${nOS(o.numero)} · ${a.nome}`;
  const logo = a.logo_path ? API.urlLogo(a.logo_path) : '';
  const idx = FLUXO.indexOf(o.status), cancel = o.status === 'Cancelado';
  const whats = telWhats(a.whatsapp || a.telefone);
  const msgLoja = `Olá! Sou ${o.cliente || 'cliente'}, sobre a ordem de serviço nº ${nOS(o.numero)} (${[o.marca, o.modelo].filter(Boolean).join(' ')}).`;
  const frase = {
    'Recebido': 'Seu aparelho foi recebido e está na fila para avaliação.', 'Em análise': 'O técnico está avaliando o aparelho.',
    'Aguardando aprovação': b && b.status === 'pendente' ? 'O orçamento está pronto. Confira abaixo e responda.' : 'Aguardando a sua resposta sobre o orçamento.',
    'Aguardando peça': 'Estamos aguardando a chegada da peça.', 'Em conserto': 'O conserto está em andamento.',
    'Pronto': 'Seu aparelho está pronto para retirada.', 'Entregue': 'Aparelho entregue. Obrigado pela confiança!', 'Cancelado': 'Esta ordem de serviço foi cancelada.'
  }[o.status] || '';
  const total = o.total !== null && o.total !== undefined;
  const restante = total ? Math.max(0, num(o.total) - num(o.recebido)) : 0;
  raiz().innerHTML = `<main class="portal">
    <div class="portal-cab">${logo ? `<img alt="" src="${esc(logo)}">` : ''}<div><b>${esc(a.nome)}</b><small class="muted">Ordem de serviço nº ${nOS(o.numero)}</small></div></div>
    <div class="portal-status"><small>${o.cliente ? `Olá, ${esc(o.cliente)}!` : 'Situação atual'}</small><b>${esc(rotulo(o.status))}</b><span>${esc(frase)}</span>
      ${o.status_desde ? `<small>Atualizado ${dataHoraBR(o.status_desde)}</small>` : ''}</div>
    ${cancel ? '' : `<div class="card"><div class="passos">${FLUXO.map((s, i) => `<div class="passo ${i < idx ? 'feito' : ''} ${i === idx ? 'atual' : ''}"><i></i><span>${esc(st(s).curto)}</span></div>`).join('')}</div></div>`}
    ${b ? blocoOrcamento(b, o) : ''}
    <div class="card"><h2>Seu aparelho</h2><div class="valores">
      <div class="lin"><span>Aparelho</span><b style="font-family:var(--body)">${esc([o.tipo_aparelho, o.marca, o.modelo].filter(Boolean).join(' · '))}</b></div>
      ${o.imei_final ? `<div class="lin"><span>IMEI / série</span><span>final ${esc(o.imei_final)}</span></div>` : ''}
      <div class="lin"><span>Entrada</span><span>${dataBR(o.data_entrada)}</span></div>
      ${o.status === 'Entregue' ? `<div class="lin"><span>Entregue</span><span>${dataBR(o.data_entrega)}</span></div>` : o.data_previsao ? `<div class="lin"><span>Previsão</span><span>${dataBR(o.data_previsao)}</span></div>` : ''}
      ${total ? `<div class="lin"><span>Valor do serviço</span><b>${brl(o.total)}</b></div>${num(o.recebido) > 0 ? `<div class="lin"><span>Já pago</span><b>${brl(o.recebido)}</b></div>` : ''}${o.status !== 'Cancelado' && restante > 0.009 && num(o.total) > 0 ? `<div class="lin total"><span>A pagar</span><b>${brl(restante)}</b></div>` : ''}` : ''}
    </div></div>
    ${o.defeito || o.diagnostico || o.reparo ? `<div class="card"><h2>Detalhes</h2>
      ${o.defeito ? `<p class="lbl" style="margin:0">Defeito informado</p><p style="margin:2px 0 10px;white-space:pre-wrap">${esc(o.defeito)}</p>` : ''}
      ${o.diagnostico ? `<p class="lbl" style="margin:0">Diagnóstico técnico</p><p style="margin:2px 0 10px;white-space:pre-wrap">${esc(o.diagnostico)}</p>` : ''}
      ${o.reparo ? `<p class="lbl" style="margin:0">Serviço realizado</p><p style="margin:2px 0 0;white-space:pre-wrap">${esc(o.reparo)}</p>` : ''}</div>` : ''}
    ${o.status === 'Entregue' && o.garantia ? `<div class="card"><h2>Garantia</h2><p style="margin:0">${o.garantia_ate ? `Garantia de ${o.garantia} dias, válida até <b>${dataBR(o.garantia_ate)}</b>.` : `${o.garantia} dias.`}</p></div>` : ''}
    ${o.status === 'Pronto' && a.orientacoes_retirada ? `<div class="card"><h2>Para retirar</h2><p style="margin:0;white-space:pre-wrap">${esc(a.orientacoes_retirada)}</p></div>` : ''}
    ${d.eventos.length ? `<div class="card"><h2>Andamento</h2><div class="linha-tempo">${d.eventos.slice().reverse().map(ev => `<div class="ev"><span class="dot ${ev.tipo === 'ordem.status' ? 'status' : ev.tipo.startsWith('orcamento.a') ? 'cliente' : ''}">${ico(iconeEvento(ev.tipo), 'sm')}</span>
      <div><p>${esc(eventoCliente(ev))}</p><small>${dataHoraBR(ev.criado_em)}</small></div></div>`).join('')}</div></div>` : ''}
    <div class="card"><h2>Fale com a assistência</h2>
      <p style="margin:0">${esc([a.endereco, a.info_extra].filter(Boolean).join(' · '))}</p>
      <p class="muted" style="margin:4px 0 0">${esc([a.telefone, a.email, a.site].filter(Boolean).join(' · '))}</p>
      ${whats ? `<a class="btn pri" style="margin-top:12px" href="https://wa.me/${whats}?text=${encodeURIComponent(msgLoja)}" target="_blank" rel="noopener noreferrer">${ico('whats', 'sm')} Conversar no WhatsApp</a>` : ''}</div>
    <p class="portal-pe">Link pessoal e seguro, válido até ${dataBR(String(d.expira_em).slice(0, 10))}. Não compartilhe.<br>Feito por FORJA OS</p>
  </main>`;
  const f = $('#form-decisao');
  let ultimoBotao = '';   // navegadores antigos não têm e.submitter
  if (f) $$('button[value]', f).forEach(x => x.addEventListener('click', () => { ultimoBotao = x.value; }));
  if (f) f.addEventListener('submit', async e => {
    e.preventDefault();
    const dec = (e.submitter && e.submitter.value) || ultimoBotao, nome = $('#dec-nome').value.trim(), motivo = ($('#dec-motivo') || {}).value || '';
    const err = $('#dec-erro');
    if (!['aprovado', 'recusado'].includes(dec)) { err.textContent = 'Toque em "Aprovar orçamento" ou em "Recusar".'; return; }
    if (nome.length < 2) { err.textContent = 'Digite seu nome completo para registrar a resposta.'; return; }
    if (!await confirmar(dec === 'aprovado' ? `Aprovar o orçamento de ${brl(b.total)}?` : 'Recusar o orçamento?', { ok: dec === 'aprovado' ? 'Aprovar' : 'Recusar', perigo: dec !== 'aprovado' })) return;
    $$('button', f).forEach(x => x.disabled = true);
    try { await API.portalDecidir(token, b.id, dec, nome, motivo); toast(dec === 'aprovado' ? 'Orçamento aprovado. Obrigado!' : 'Resposta registrada.'); telaPortal(token); }
    catch (er) { err.textContent = msgErro(er); $$('button', f).forEach(x => x.disabled = false); }
  });
}

function blocoOrcamento(b, o) {
  const itens = (b.itens || []).map(i => `<div class="lin"><span>${i.qtd > 1 ? i.qtd + '× ' : ''}${esc(i.nome)}</span><b>${brl(i.subtotal)}</b></div>`).join('');
  return `<div class="card" id="orcamento"><div class="card-cab"><h2>Orçamento <small>versão ${b.versao} · ${dataBR(String(b.criado_em).slice(0, 10))}</small></h2>
      <span class="pill ${{ pendente: 'warn', aprovado: 'ok', recusado: 'bad' }[b.status] || ''}">${{ pendente: 'Aguardando sua resposta', aprovado: 'Aprovado', recusado: 'Recusado' }[b.status] || b.status}</span></div>
    <div class="valores">${itens}${num(b.mao_obra) ? `<div class="lin"><span>Mão de obra</span><b>${brl(b.mao_obra)}</b></div>` : ''}
      ${num(b.desconto) ? `<div class="lin"><span>Desconto</span><b>− ${brl(b.desconto)}</b></div>` : ''}${num(b.acrescimo) > 0.004 ? `<div class="lin"><span>Acréscimo cartão</span><b>${brl(b.acrescimo)}</b></div>` : ''}
      <div class="lin total"><span>Total</span><b>${brl(b.total)}</b></div></div>
    ${b.prazo ? `<p style="margin:10px 0 0"><b>Prazo:</b> ${esc(b.prazo)}</p>` : ''}${b.garantia ? `<p style="margin:4px 0 0"><b>Garantia:</b> ${b.garantia} dias após a entrega</p>` : ''}
    ${b.condicoes ? `<p class="muted" style="margin:6px 0 0;white-space:pre-wrap">${esc(b.condicoes)}</p>` : ''}
    ${b.status === 'pendente' ? `<form id="form-decisao" novalidate style="display:grid;gap:10px;margin-top:14px">
        ${campo('dec-nome', 'Seu nome completo', '', 'maxlength="120" autocomplete="name"')}
        ${campo('dec-motivo', 'Observação (opcional)', '', 'maxlength="500"')}
        <p class="erro-txt" id="dec-erro" role="alert"></p>
        <div class="row"><button type="submit" class="btn pri" value="aprovado">${ico('check', 'sm')} Aprovar orçamento</button><button type="submit" class="btn" value="recusado">Recusar</button></div>
        <p class="hint">Sua resposta fica registrada com data e hora junto à ordem de serviço.</p></form>`
      : b.decidido_em ? `<p class="hint">Resposta registrada em ${dataHoraBR(b.decidido_em)}${b.decisao_canal === 'balcao' ? ' na loja' : ''}.</p>` : ''}
  </div>`;
}

function eventoCliente(ev) {
  const d = ev.dados || {};
  if (ev.tipo === 'ordem.aberta') return 'Ordem de serviço aberta';
  if (ev.tipo === 'ordem.status') return rotulo(d.para);
  if (ev.tipo === 'ordem.diagnostico') return 'Diagnóstico registrado';
  if (ev.tipo === 'orcamento.publicado') return `Orçamento enviado (versão ${d.versao})`;
  if (ev.tipo === 'orcamento.aprovado') return `Orçamento aprovado (versão ${d.versao})`;
  if (ev.tipo === 'orcamento.recusado') return `Orçamento recusado (versão ${d.versao})`;
  return 'Atualização';
}

// =====================================================================
//  Documento da ordem de serviço: PDF A4 e cupom 80 mm (impressora térmica)
//  Marca da assistência no cabeçalho; "Feito por FORJA OS" só no rodapé.
// =====================================================================
const hexRGB = h => { h = corValida(h); return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); };
const misturar = (rgb, f) => rgb.map(c => Math.round(c + (255 - c) * f));
const formatoImg = d => /^data:image\/png/i.test(d) ? 'PNG' : 'JPEG';
const ASSINATURA_PLATAFORMA = 'Feito por FORJA OS';

async function dadosDocumento(o, exemplo) {
  const e = S.empresa, c = S.ini.config || {};
  const doc = { o, e, c, exemplo, logo: S.logoData || '', fotos: [], assinatura: '', link: '', recs: exemplo ? [] : (OS.o && OS.o.id === o.id ? OS.recs : []) };
  if (!exemplo) {
    if (c.pdf_fotos) {
      for (const f of (o.fotos || []).filter(f => (f.etapa || 'entrada') === 'entrada').slice(0, 8)) {
        try { const u = await urlFotoOS(f); const b = await (await fetch(u)).blob(); doc.fotos.push({ data: await blobParaData(b), w: f.w, h: f.h }); } catch { }
      }
    }
    if (o.assinatura_path) { try { const u = await urlFotoOS({ path: o.assinatura_path }); doc.assinatura = await blobParaData(await (await fetch(u)).blob()); } catch { } }
    if (c.pdf_qr && recurso('portal') && o.status !== 'Cancelado') doc.link = await obterLink(true);
  }
  return doc;
}

async function gerarDocumento(formato = 'a4', acao = 'baixar', o = OS.o, exemplo = false) {
  if (!window.jspdf) { toast('O gerador de PDF não carregou. Recarregue a página.', true); return; }
  if (!exemplo && S.sujo) { try { await salvarOS(true); } catch { return; } o = OS.o; }
  toast(acao === 'imprimir' ? 'Preparando a impressão…' : 'Gerando o documento…');
  try {
    const d = await dadosDocumento(o, exemplo);
    const pdf = formato === 'cupom' ? montarCupom(d) : montarA4(d);
    const nome = exemplo ? 'documento-exemplo.pdf' : `OS-${nOS(o.numero)}-${textoPDF(o.cliente_nome || 'cliente').normalize('NFD').replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-') || 'cliente'}${formato === 'cupom' ? '-cupom' : ''}.pdf`;
    if (acao === 'imprimir') pdf.autoPrint();
    const blob = pdf.output('blob');
    if (acao === 'baixar') { baixarArquivo(blob, nome); return; }
    const url = URL.createObjectURL(blob);
    const w = window.open(url, '_blank', 'noopener');
    if (!w) baixarArquivo(blob, nome);
    setTimeout(() => URL.revokeObjectURL(url), 120000);
  } catch (e) { console.error(e); toast('Não foi possível gerar o documento.', true); }
}

// ---------- A4 ----------
function montarA4(D) {
  const { jsPDF } = window.jspdf;
  const { o, e, c } = D;
  const pdf = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, H = 297, M = 14, CW = W - 2 * M, RODAPE = 14;
  const COR = hexRGB(e.cor), COR2 = hexRGB(e.cor_secundaria || '#1c2026'), CINZA = [95, 99, 110], TINTA = [24, 26, 30];
  const T = (s, x, y, op) => pdf.text(Array.isArray(s) ? s.map(textoPDF) : textoPDF(s), x, y, op);
  const quebra = (s, w) => pdf.splitTextToSize(textoPDF(s || ''), w);
  let y = 0;
  const cabe = h => { if (y + h > H - M - RODAPE) { pdf.addPage(); y = M + 2; } };
  const fonte = (tam, peso = 'normal', cor = TINTA) => { pdf.setFont('helvetica', peso); pdf.setFontSize(tam); pdf.setTextColor(...cor); };

  // cabeçalho
  pdf.setFillColor(...COR); pdf.rect(0, 0, W, 4, 'F');
  let xNome = M, alturaLogo = 0;
  if (D.logo) {
    try { const p = pdf.getImageProperties(D.logo); const h = 18, w = Math.min(34, h * p.width / p.height); alturaLogo = w * p.height / p.width;
      pdf.addImage(D.logo, formatoImg(D.logo), M, 9, w, alturaLogo); xNome = M + w + 4; } catch { }
  }
  const larguraEsq = 112 - (xNome - M);
  fonte(17, 'bold'); T(quebra(e.nome.toUpperCase(), larguraEsq)[0], xNome, 15.5);
  fonte(8.2, 'normal', CINZA);
  const contato = [e.razao_social && e.razao_social !== e.nome ? e.razao_social : '', e.documento ? 'CNPJ/CPF ' + e.documento : '',
    [e.telefone && 'Tel. ' + e.telefone, e.whatsapp && 'WhatsApp ' + e.whatsapp].filter(Boolean).join(' · '), [e.email, e.site].filter(Boolean).join(' · '), e.endereco, e.info_extra].filter(Boolean);
  let yc = 20; contato.slice(0, 5).forEach(l => { quebra(l, larguraEsq).slice(0, 1).forEach(t => { T(t, xNome, yc); yc += 3.7; }); });
  fonte(8.5, 'bold', COR); T('ORDEM DE SERVIÇO', W - M, 12, { align: 'right' });
  fonte(21, 'bold'); T(D.exemplo ? 'EXEMPLO' : 'Nº ' + nOS(o.numero), W - M, 20.5, { align: 'right' });
  fonte(8.2, 'normal', CINZA);
  T(`Abertura: ${o.criado_em ? dataHoraBR(o.criado_em) : dataBR(o.data_entrada)}`, W - M, 25.5, { align: 'right' });
  T(o.status === 'Entregue' ? `Entregue em ${dataBR(o.data_entrega)}` : `Previsão: ${dataBR(o.data_previsao)}`, W - M, 29.2, { align: 'right' });
  T(`Situação: ${rotulo(o.status)}`, W - M, 32.9, { align: 'right' });
  y = Math.max(37, yc + 1, 9 + alturaLogo + 3);
  pdf.setDrawColor(...COR); pdf.setLineWidth(0.6); pdf.line(M, y, W - M, y); y += 6;

  const secao = t => { cabe(14); pdf.setFillColor(...misturar(COR2, 0.9)); pdf.rect(M, y - 4.2, CW, 6.2, 'F'); pdf.setFillColor(...COR); pdf.rect(M, y - 4.2, 1.2, 6.2, 'F');
    fonte(9, 'bold', COR2); T(t.toUpperCase(), M + 3, y); y += 6.5; };
  const pares = (lista, cols = 3) => {
    const cw = CW / cols;
    for (let i = 0; i < lista.length; i += cols) {
      const lin = lista.slice(i, i + cols);
      fonte(9.5); const alt = lin.map(([, v]) => quebra(String(v || '—'), cw - 3).length);
      const h = 4 + Math.max(...alt) * 4.1 + 2; cabe(h);
      lin.forEach(([r, v], j) => { const x = M + j * cw; fonte(7, 'normal', CINZA); T(r.toUpperCase(), x, y); fonte(9.5); T(quebra(String(v || '—'), cw - 3), x, y + 4.2); });
      y += h;
    }
  };
  const paragrafo = (r, v) => { if (!String(v || '').trim()) return; fonte(9.5); const l = quebra(v, CW); for (let i = 0; i < l.length; i += 40) { const parte = l.slice(i, i + 40); cabe(6 + parte.length * 4.3);
    if (i === 0) { fonte(7, 'normal', CINZA); T(r.toUpperCase(), M, y); } fonte(9.5); T(parte, M, y + 4.3); y += 5 + parte.length * 4.3; } y += 1; };

  secao('Cliente');
  pares([['Nome', o.cliente_nome], ['WhatsApp', o.cliente_tel], [o.cliente_doc ? 'CPF' : 'E-mail', o.cliente_doc || o.cliente_email]]);
  secao('Aparelho');
  pares([['Tipo / marca / modelo', [o.tipo_aparelho, o.marca, o.modelo].filter(Boolean).join(' · ')], ['IMEI / nº de série', o.imei], ['Cor', o.cor],
    ['Acessórios deixados', o.acessorios || 'Nenhum'], ['Técnico responsável', nomeMembro(o.tecnico_id) || '—'], ['Garantia do serviço', `${num(o.garantia)} dias${o.garantia_ate ? ' (até ' + dataBR(o.garantia_ate) + ')' : ''}`]]);
  if (c.pdf_checklist !== false && (o.checks || []).length) paragrafo('Conferido na entrada', o.checks.join(' · '));
  secao('Serviço');
  paragrafo('Defeito relatado pelo cliente', o.defeito || '—');
  paragrafo('Diagnóstico técnico', o.diagnostico);
  paragrafo('Serviço realizado', o.reparo);
  paragrafo('Observações', o.obs);

  // valores
  const v = valoresOS(o);
  if (v.total > 0 || (o.itens || []).length) {
    secao('Valores');
    const lv = (r, val, forte, cor) => { cabe(7); fonte(forte ? 11.5 : 9.5, forte ? 'bold' : 'normal', cor || TINTA); T(r, M + 2, y); T(val, W - M - 2, y, { align: 'right' });
      pdf.setDrawColor(222, 224, 228); pdf.setLineWidth(0.2); pdf.line(M, y + 2, W - M, y + 2); y += forte ? 7.5 : 6.2; };
    (o.itens || []).filter(it => it.nome || num(it.custo) || num(it.preco)).forEach(it => { const q = num(it.qtd) || 1; lv(`${q > 1 ? q + '× ' : ''}${it.nome || 'Peça'}`, brl(precoItem(it) * q)); });
    if (num(o.mao_obra)) lv('Mão de obra', brl(o.mao_obra));
    if (num(o.desconto)) lv('Desconto', '- ' + brl(o.desconto));
    if (v.valorTaxa > 0.004) lv('Acréscimo cartão', brl(v.valorTaxa));
    lv('TOTAL', brl(v.total), true, COR);
    if (num(o.recebido) > 0) { lv('Pago', brl(o.recebido)); if (o.status !== 'Cancelado') lv('Restante', brl(Math.max(0, v.total - num(o.recebido))), true); }
    y += 1;
  }

  // fotos
  if (D.fotos.length) {
    secao('Fotos do aparelho na entrada');
    const POR = 6, lado = (CW - (POR - 1) * 3) / POR;   // 6 por linha: a ordem costuma caber em uma página
    D.fotos.forEach((f, i) => {
      if (i % POR === 0) { if (i) y += lado + 3; cabe(lado + 2); }
      const x = M + (i % POR) * (lado + 3), r = Math.min(lado / (f.w || 1), lado / (f.h || 1)), w = (f.w || 1) * r, h = (f.h || 1) * r;
      pdf.setDrawColor(210, 212, 216); pdf.rect(x, y, lado, lado);
      try { pdf.addImage(f.data, 'JPEG', x + (lado - w) / 2, y + (lado - h) / 2, w, h); } catch { }
    });
    y += lado + 5;
  }

  // QR do acompanhamento
  if (D.link) {
    cabe(34);
    const m = qrMatriz(D.link);
    if (m) {
      const n = m.length, tam = 26, k = tam / n;
      pdf.setFillColor(0, 0, 0);
      m.forEach((lin, r) => lin.forEach((on, cc) => { if (on) pdf.rect(M + cc * k, y + r * k, k, k, 'F'); }));
      fonte(10, 'bold'); T('Acompanhe o conserto pelo celular', M + tam + 5, y + 7);
      fonte(8.5, 'normal', CINZA); T(quebra('Aponte a câmera para o código ao lado para ver o andamento, aprovar o orçamento e saber quando retirar. O link é pessoal.', CW - tam - 5), M + tam + 5, y + 12);
      y += tam + 5;
    }
  }

  // termos e retirada
  const blocoTexto = (titulo, txt) => { if (!String(txt || '').trim()) return; fonte(7.8); const l = quebra(txt, CW); cabe(Math.min(l.length, 12) * 3.4 + 7);
    fonte(7.5, 'bold', CINZA); T(titulo, M, y); y += 3.8; fonte(7.8, 'normal', CINZA);
    l.forEach(t => { cabe(3.4); T(t, M, y); y += 3.4; }); y += 3; };
  blocoTexto('ORIENTAÇÕES DE RETIRADA', e.orientacoes_retirada);
  blocoTexto('TERMOS E CONDIÇÕES', e.termos);

  // assinaturas
  cabe(30); y += 12;
  if (D.assinatura) { try { const p = pdf.getImageProperties(D.assinatura); const w = 60, h = Math.min(18, w * p.height / p.width); pdf.addImage(D.assinatura, 'PNG', M + 9, y - h - 1, w, h); } catch { } }
  pdf.setDrawColor(70, 72, 78); pdf.setLineWidth(0.3); pdf.line(M, y, M + 78, y); pdf.line(W - M - 78, y, W - M, y);
  fonte(8, 'normal', TINTA);
  T(D.assinatura ? textoPDF(o.assinatura_nome || 'Cliente') : 'Assinatura do cliente', M + 39, y + 4, { align: 'center' });
  if (D.assinatura && o.assinado_em) { fonte(7, 'normal', CINZA); T(`Assinado na entrada em ${dataHoraBR(o.assinado_em)}`, M + 39, y + 7.5, { align: 'center' }); }
  fonte(8, 'normal', TINTA); T(quebra(e.nome + ' — responsável técnico', 76)[0], W - M - 39, y + 4, { align: 'center' });
  y += 10;

  // rodapé em todas as páginas
  const total = pdf.getNumberOfPages();
  for (let p = 1; p <= total; p++) {
    pdf.setPage(p);
    pdf.setDrawColor(230, 231, 234); pdf.setLineWidth(0.2); pdf.line(M, H - 11, W - M, H - 11);
    fonte(7, 'normal', [140, 144, 152]);
    T(`OS nº ${D.exemplo ? 'EXEMPLO' : nOS(o.numero)} · ${textoPDF(e.nome)} · página ${p} de ${total}`, M, H - 7);
    T(ASSINATURA_PLATAFORMA, W - M, H - 7, { align: 'right' });
  }
  return pdf;
}

// ---------- cupom 80 mm ----------
function montarCupom(D) {
  const { jsPDF } = window.jspdf;
  const desenhar = (pdf, medir) => {
    const { o, e, c } = D, W = 80, M = 4, CW = W - 2 * M, PRETO = [0, 0, 0];
    const T = (s, x, y, op) => pdf.text(Array.isArray(s) ? s.map(textoPDF) : textoPDF(s), x, y, op);
    const quebra = (s, w = CW) => pdf.splitTextToSize(textoPDF(s || ''), w);
    const fonte = (t, p = 'normal') => { pdf.setFont('helvetica', p); pdf.setFontSize(t); pdf.setTextColor(...PRETO); };
    let y = 6;
    const linha = () => { pdf.setLineDashPattern([0.8, 0.8], 0); pdf.setDrawColor(0); pdf.setLineWidth(0.2); pdf.line(M, y, W - M, y); pdf.setLineDashPattern([], 0); y += 3.5; };
    const centro = (s, t = 8, p = 'normal') => { fonte(t, p); quebra(s).forEach(l => { T(l, W / 2, y, { align: 'center' }); y += t * 0.42; }); };
    const par = (r, v) => { if (!String(v || '').trim()) return; fonte(7, 'bold'); T(r, M, y); y += 3; fonte(8); quebra(v).forEach(l => { T(l, M, y); y += 3.4; }); y += 0.8; };
    const lv = (r, v, forte) => { fonte(forte ? 9 : 8, forte ? 'bold' : 'normal'); const l = quebra(r, CW - 24); T(l, M, y); T(v, W - M, y, { align: 'right' }); y += Math.max(1, l.length) * 3.6; };

    if (D.logo) { try { const p = pdf.getImageProperties(D.logo); const w = Math.min(36, 16 * p.width / p.height), h = w * p.height / p.width; pdf.addImage(D.logo, formatoImg(D.logo), (W - w) / 2, y - 2, w, h); y += h + 2; } catch { } }
    centro(e.nome.toUpperCase(), 11, 'bold'); y += 0.5;
    [e.documento && 'CNPJ/CPF ' + e.documento, [e.telefone, e.whatsapp].filter(Boolean).join(' · '), e.endereco, e.info_extra].filter(Boolean).forEach(l => centro(l, 7));
    y += 1.5; linha();
    centro(D.exemplo ? 'ORDEM DE SERVIÇO · EXEMPLO' : `ORDEM DE SERVIÇO Nº ${nOS(o.numero)}`, 9.5, 'bold');
    centro(`${o.criado_em ? dataHoraBR(o.criado_em) : dataBR(o.data_entrada)} · ${rotulo(o.status)}`, 7.5);
    y += 1; linha();
    par('CLIENTE', [o.cliente_nome, o.cliente_tel].filter(Boolean).join(' · '));
    par('APARELHO', [o.tipo_aparelho, o.marca, o.modelo, o.cor].filter(Boolean).join(' · '));
    if (o.imei) par('IMEI / SÉRIE', o.imei);
    if (o.acessorios) par('ACESSÓRIOS', o.acessorios);
    if (c.pdf_checklist !== false && (o.checks || []).length) par('CONFERIDO NA ENTRADA', o.checks.join(', '));
    par('DEFEITO RELATADO', o.defeito);
    par('DIAGNÓSTICO', o.diagnostico);
    par('SERVIÇO REALIZADO', o.reparo);
    if (o.status !== 'Entregue') par('PREVISÃO', dataBR(o.data_previsao));
    const v = valoresOS(o);
    if (v.total > 0) {
      linha();
      (o.itens || []).filter(it => it.nome || num(it.custo) || num(it.preco)).forEach(it => { const q = num(it.qtd) || 1; lv(`${q > 1 ? q + 'x ' : ''}${it.nome || 'Peça'}`, brl(precoItem(it) * q)); });
      if (num(o.mao_obra)) lv('Mão de obra', brl(o.mao_obra));
      if (num(o.desconto)) lv('Desconto', '- ' + brl(o.desconto));
      if (v.valorTaxa > 0.004) lv('Acréscimo cartão', brl(v.valorTaxa));
      lv('TOTAL', brl(v.total), true);
      if (num(o.recebido) > 0) { lv('Pago', brl(o.recebido)); if (o.status !== 'Cancelado') lv('Restante', brl(Math.max(0, v.total - num(o.recebido))), true); }
    }
    par('GARANTIA', `${num(o.garantia)} dias${o.garantia_ate ? ' · até ' + dataBR(o.garantia_ate) : ' após a entrega'}`);
    if (D.link) {
      linha();
      const m = qrMatriz(D.link);
      if (m) { const tam = 30, k = tam / m.length, x0 = (W - tam) / 2; pdf.setFillColor(0, 0, 0); m.forEach((lin, r) => lin.forEach((on, cc) => { if (on) pdf.rect(x0 + cc * k, y + r * k, k, k, 'F'); })); y += tam + 3; }
      centro('Acompanhe o conserto: aponte a câmera', 7.5, 'bold');
    }
    if (String(e.orientacoes_retirada || '').trim()) { linha(); par('RETIRADA', e.orientacoes_retirada); }
    if (String(e.termos || '').trim()) { linha(); fonte(6.5); quebra(e.termos).forEach(l => { T(l, M, y); y += 2.8; }); y += 1; }
    y += 10;
    if (D.assinatura) { try { const p = pdf.getImageProperties(D.assinatura); const w = 44, h = Math.min(14, w * p.height / p.width); pdf.addImage(D.assinatura, 'PNG', (W - w) / 2, y - h - 1, w, h); } catch { } }
    pdf.setDrawColor(0); pdf.setLineWidth(0.25); pdf.line(M + 8, y, W - M - 8, y); y += 3.5;
    centro(D.assinatura ? (o.assinatura_nome || 'Cliente') : 'Assinatura do cliente', 7.5);
    y += 3; linha();
    centro(ASSINATURA_PLATAFORMA, 6.5);
    y += 4;
    return y;
  };
  const rascunho = new jsPDF({ unit: 'mm', format: [80, 3000] });
  const altura = Math.max(80, Math.ceil(desenhar(rascunho, true)));
  const pdf = new jsPDF({ unit: 'mm', format: [80, altura] });
  desenhar(pdf, false);
  return pdf;
}

SB.aoMudar(ev => {
  if (ev === 'SIGNED_OUT') {
    S.ini = null; S.empresa = null; S.sujo = false; S.salvarPendente = null; S.abertas = []; S.pecas = null;
    const r = lerRota();
    if (r.nome === 'acompanhar') return;
    telaAuth('entrar');
  }
});

(async function iniciar() {
  aplicarMarca(marcaSalva());
  const r = lerRota();
  if (!SB.configurado) return telaConfig();
  if (r.nome === 'acompanhar') return telaPortal(r.id);
  let tipo;
  try { tipo = await SB.iniciar(); }
  catch (e) { return telaAuth('entrar', msgErro(e)); }
  if (tipo === 'recovery') return telaAuth('nova');
  if (r.nome === 'convite') return telaConvite(r.id);
  if (SB.sessao) return abrirSistema();
  telaAuth('entrar');
})();
</script>
